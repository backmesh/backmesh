<template id="s3-cost-template">
  <div id="s3-root" data-composition-id="s3-cost" data-width="1920" data-height="1080" data-duration="4.4">
    <style>
      @font-face { font-family: "Schibsted Grotesk"; src: url("assets/fonts/SchibstedGrotesk.woff2") format("woff2"); font-weight: 400 900; }
      @font-face { font-family: "Fragment Mono"; src: url("assets/fonts/FragmentMono.woff2") format("woff2"); font-weight: 400; }
      #s3-root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Schibsted Grotesk", sans-serif; color: #2c3036; }
      #s3-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #s3-col { width: 1600px; }
      #s3-h2 { max-width: 1500px; font-weight: 700; font-size: 76px; line-height: 1.08; letter-spacing: -0.03em; color: #15171a; }
      #s3-h2 .accent { color: #0e6ba8; white-space: nowrap; }
      /* The page's chart (website/src/components/Chart.astro): label, bar of
         segments on one shared axis, value at the bar's end. */
      #s3-chart { margin-top: 72px; }
      #s3-rows { position: relative; }
      .s3-row { display: grid; grid-template-columns: 400px 972px; column-gap: 28px; align-items: center; height: 84px; position: relative; }
      .s3-name { display: flex; align-items: center; gap: 16px; color: #15171a; font-weight: 600; font-size: 30px; }
      .s3-name img { width: 28px; height: 28px; display: block; }
      .s3-bar { position: relative; height: 40px; }
      .s3-bar i { position: absolute; top: 0; bottom: 0; transform-origin: 0% 50%; display: block; }
      .s3-ink { background: #0b3557; }
      .s3-solid { background: #0e6ba8; }
      .s3-range { background: #adcde1; }
      .s3-fixed { background: repeating-linear-gradient(135deg, #0e6ba8 0 2.5px, #dde9f3 2.5px 8px); }
      .s3-val { position: absolute; top: 2px; padding-left: 18px; font: 400 27px "Fragment Mono", monospace; color: #0e6ba8; white-space: nowrap; }
      .s3-row.gh .s3-val { color: #15171a; }
    </style>
    <div id="s3-stage" class="clip" data-start="0" data-duration="4.4" data-track-index="0">
      <div id="s3-col">
        <!-- Figures computed by website/src/cost.ts (headline, totals) as the page rounds them. -->
        <h2 id="s3-h2">150,000 minutes a month: $1,800 on GitHub, <span class="accent">$191–$365</span> on backmesh.</h2>
        <div id="s3-chart">
          <div id="s3-rows">
            <div class="s3-row gh"><div class="s3-name">GitHub-hosted</div><div class="s3-bar"><i class="s3-ink" data-from="0" data-to="1800"></i><span class="s3-val">$1,800</span></div></div>
            <div class="s3-row"><div class="s3-name"><img src="assets/brand/aws.svg" alt="" />backmesh on AWS</div><div class="s3-bar"><i class="s3-fixed" data-from="0" data-to="86"></i><i class="s3-solid" data-from="86" data-to="210.25"></i><i class="s3-range" data-from="210.25" data-to="261"></i><span class="s3-val">$210–$261</span></div></div>
            <div class="s3-row"><div class="s3-name"><img src="assets/brand/azure.svg" alt="" />backmesh on Azure</div><div class="s3-bar"><i class="s3-fixed" data-from="0" data-to="111"></i><i class="s3-solid" data-from="111" data-to="190.5"></i><i class="s3-range" data-from="190.5" data-to="206.25"></i><span class="s3-val">$191–$206</span></div></div>
            <div class="s3-row"><div class="s3-name"><img src="assets/brand/gcp.svg" alt="" />backmesh on GCP</div><div class="s3-bar"><i class="s3-fixed" data-from="0" data-to="74"></i><i class="s3-solid" data-from="74" data-to="298.75"></i><i class="s3-range" data-from="298.75" data-to="365.25"></i><span class="s3-val">$299–$365</span></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="s3-cost"]');
      const MAX = 1800, W = 972;
      root.querySelectorAll(".s3-bar").forEach((bar) => {
        let end = 0;
        bar.querySelectorAll("i").forEach((seg) => {
          const from = +seg.dataset.from, to = +seg.dataset.to;
          seg.style.left = (from / MAX) * W + "px";
          seg.style.width = ((to - from) / MAX) * W + "px";
          end = Math.max(end, to);
        });
        bar.querySelector(".s3-val").style.left = (end / MAX) * W + "px";
      });
      tl.fromTo("#s3-h2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.4);
      tl.fromTo(".s3-name", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.6);
      // GitHub's bar runs the whole axis; each backmesh bar stops short.
      const rows = root.querySelectorAll(".s3-row");
      rows.forEach((row, r) => {
        const start = r === 0 ? 0.75 : 1.6 + 0.25 * (r - 1);
        const segs = row.querySelectorAll(".s3-bar i");
        const total = r === 0 ? 0.9 : 0.4;
        segs.forEach((seg, i) =>
          tl.fromTo(seg, { scaleX: 0 }, { scaleX: 1, duration: total / segs.length, ease: i === segs.length - 1 ? "power2.out" : "none" }, start + (i * total) / segs.length));
        tl.fromTo(row.querySelector(".s3-val"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, start + total);
      });
      window.__timelines["s3-cost"] = tl;
    })();
  </script>
</template>
