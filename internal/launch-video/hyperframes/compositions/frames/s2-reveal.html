<template id="s2-reveal-template">
  <div id="s2-root" data-composition-id="s2-reveal" data-width="1920" data-height="1080" data-duration="4">
    <style>
      @font-face { font-family: "Bricolage Grotesque"; src: url("assets/fonts/Bricolage.woff2") format("woff2"); font-weight: 200 800; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.woff2") format("woff2"); font-weight: 100 900; }
      #s2-root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; }
      #s2-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #s2-lockup { display: flex; align-items: center; gap: 44px; }
      #s2-mark { width: 230px; height: 230px; display: block; overflow: visible; }
      #s2-word { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 190px; letter-spacing: -0.045em; color: #eef3f9; line-height: 1; display: block; }
      #s2-sub { margin-top: 56px; font-size: 54px; font-weight: 500; color: #eef3f9; letter-spacing: -0.01em; white-space: nowrap; }
      #s2-sub .hi { color: #7cc4f5; }
      #s2-clouds { margin-top: 80px; display: flex; gap: 120px; align-items: center; }
      .s2-cloud { height: 110px; width: 110px; display: block; }
    </style>
    <div id="s2-stage" class="clip" data-start="0" data-duration="4" data-track-index="0">
      <div id="s2-lockup">
        <!-- The Woven B, website/public/brand/mark-dark.svg, one element per thread. -->
        <svg id="s2-mark" viewBox="0 0 48 48" aria-label="backmesh">
          <rect class="s2-h" x="16" y="4.5" width="16.5" height="7" fill="#eef3f9" />
          <rect class="s2-h" x="16" y="18.5" width="8" height="7" fill="#eef3f9" />
          <rect class="s2-h" x="34" y="18.5" width="6.5" height="7" fill="#eef3f9" />
          <rect class="s2-h" x="16" y="36.5" width="16" height="7" fill="#eef3f9" />
          <rect class="s2-v" x="7.5" y="4.5" width="7" height="39" fill="#7cc4f5" />
          <rect class="s2-v" x="25.5" y="13" width="7" height="12.5" fill="#7cc4f5" />
          <rect class="s2-v" x="33.5" y="27" width="7" height="16.5" fill="#7cc4f5" />
        </svg>
        <span id="s2-word">backmesh</span>
      </div>
      <div id="s2-sub">One VM per job, in your own <span class="hi">AWS, GCP or Azure.</span></div>
      <div id="s2-clouds">
        <img class="s2-cloud" src="assets/brand/aws.svg" alt="AWS" />
        <img class="s2-cloud" src="assets/brand/gcp.svg" alt="Google Cloud" />
        <img class="s2-cloud" src="assets/brand/azure.svg" alt="Azure" />
      </div>
    </div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="s2-reveal"]');
      // The B weaves together: weft threads slide in from alternate sides,
      // warp threads drop and rise through them, all landing on 1.0 s (4.0 s).
      root.querySelectorAll(".s2-h").forEach((r, i) => {
        tl.fromTo(r, { x: i % 2 ? 40 : -40, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "power3.inOut" }, 0.35 + i * 0.03);
      });
      root.querySelectorAll(".s2-v").forEach((r, i) => {
        tl.fromTo(r, { y: i % 2 ? 40 : -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.inOut" }, 0.4 + i * 0.03);
      });
      tl.fromTo("#s2-mark", { scale: 0.8 }, { scale: 1, duration: 0.7, ease: "power3.out" }, 0.3);
      tl.fromTo("#s2-word", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.9);
      tl.fromTo("#s2-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.3);
      // The cloud logos land on the beats at 2.0, 2.5 and 3.0 s (5.0, 5.5, 6.0 s).
      root.querySelectorAll(".s2-cloud").forEach((c, i) => {
        const beat = 2.0 + 0.5 * i;
        tl.fromTo(c, { opacity: 0, y: -70, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "power2.in" }, beat - 0.3);
        tl.fromTo(c, { scaleY: 0.85 }, { scaleY: 1, duration: 0.3, ease: "back.out(4)", immediateRender: false }, beat);
      });
      window.__timelines["s2-reveal"] = tl;
    })();
  </script>
</template>
