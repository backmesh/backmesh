<template id="s7-cue-template">
  <div id="s7-root" data-composition-id="s7-cue" data-width="1920" data-height="1080" data-duration="4.2">
    <style>
      @font-face { font-family: "Schibsted Grotesk"; src: url("assets/fonts/SchibstedGrotesk.woff2") format("woff2"); font-weight: 400 900; }
      @font-face { font-family: "Fragment Mono"; src: url("assets/fonts/FragmentMono.woff2") format("woff2"); font-weight: 400; }
      #s7-root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Schibsted Grotesk", sans-serif; color: #2c3036; }
      #s7-stage { position: absolute; inset: 0; display: flex; justify-content: center; padding-top: 210px; }
      #s7-col { width: 1600px; }
      #s7-h2 { font-weight: 700; font-size: 80px; line-height: 1.08; letter-spacing: -0.03em; color: #15171a; }
      #s7-p { margin-top: 26px; max-width: 1380px; font-size: 36px; line-height: 1.45; }
      /* The page's CueLanes: the same boot, after the push and before it. */
      #s7-fig { position: relative; margin-top: 76px; padding-top: 76px; display: grid; gap: 70px; }
      #s7-rule { position: absolute; left: 0; top: 0; width: 1600px; height: 3px; background: #15171a; transform-origin: 0% 50%; display: block; }
      .s7-lane { display: grid; grid-template-columns: 290px 1280px; column-gap: 30px; align-items: center; }
      .s7-who { color: #15171a; font-size: 32px; font-weight: 500; }
      .s7-track { position: relative; height: 64px; }
      .s7-seg { position: absolute; top: 6px; height: 52px; display: flex; align-items: center; padding: 0 20px; overflow: hidden; white-space: nowrap; font: 400 25px "Fragment Mono", monospace; transform-origin: 0% 50%; }
      .s7-boot { background: #b9d4e8; color: #15171a; }
      .s7-job { background: #0e6ba8; color: #ffffff; }
      .s7-push { position: absolute; top: -18px; bottom: -6px; width: 3px; background: #15171a; transform-origin: 50% 100%; display: block; }
      .s7-push b { position: absolute; top: -34px; left: -30px; color: #15171a; font: 400 23px "Fragment Mono", monospace; font-weight: 400; }
      #s7-key { display: flex; gap: 44px; color: #5f6670; font-size: 26px; margin-top: -10px; }
      #s7-key span { display: flex; align-items: center; gap: 14px; }
      #s7-key i { width: 28px; height: 20px; display: block; }
    </style>
    <div id="s7-stage" class="clip" data-start="0" data-duration="4.2" data-track-index="0">
      <div id="s7-col">
        <h2 id="s7-h2">The boot happens before the push.</h2>
        <p id="s7-p">Your coding agent cues backmesh as its checks start, so runners boot while it finishes and the job starts on one that's already up.</p>
        <div id="s7-fig">
          <i id="s7-rule"></i>
          <div class="s7-lane">
            <span class="s7-who">Without a cue</span>
            <div class="s7-track">
              <i id="s7-push-a" class="s7-push" style="left: 40%"><b>push</b></i>
              <span id="s7-boot-a" class="s7-seg s7-boot" style="left: 41%; width: 36%">VM boots</span>
              <span id="s7-job-a" class="s7-seg s7-job" style="left: 78%; width: 22%">job runs</span>
            </div>
          </div>
          <div class="s7-lane">
            <span class="s7-who">With a cue</span>
            <div class="s7-track">
              <span id="s7-boot-b" class="s7-seg s7-boot" style="left: 3%; width: 36%">VM boots</span>
              <i id="s7-push-b" class="s7-push" style="left: 40%"><b>push</b></i>
              <span id="s7-job-b" class="s7-seg s7-job" style="left: 41%; width: 46%">job runs</span>
            </div>
          </div>
          <div id="s7-key"><span><i style="background: #b9d4e8"></i>runner VM boots</span><span><i style="background: #0e6ba8"></i>CI job</span></div>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s7-h2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.4);
      tl.fromTo("#s7-p", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.5);
      tl.fromTo("#s7-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 0.7);
      tl.fromTo(".s7-who", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.9);
      // Without a cue: push, then the boot, then the job.
      tl.fromTo("#s7-push-a", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.25, ease: "power2.out" }, 1.0);
      tl.fromTo("#s7-boot-a", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "none" }, 1.2);
      tl.fromTo("#s7-job-a", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, 1.78);
      // With a cue: the same boot first, then the push, then the job at once.
      tl.fromTo("#s7-boot-b", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "none" }, 2.25);
      tl.fromTo("#s7-push-b", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.25, ease: "power2.out" }, 2.83);
      tl.fromTo("#s7-job-b", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.out" }, 2.95);
      tl.fromTo("#s7-key", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 3.2);
      window.__timelines["s7-cue"] = tl;
    })();
  </script>
</template>
