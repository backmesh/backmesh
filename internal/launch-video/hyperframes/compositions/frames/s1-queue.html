<template id="s1-queue-template">
  <div id="s1-root" data-composition-id="s1-queue" data-width="1920" data-height="1080" data-duration="3.5">
    <style>
      @font-face { font-family: "Bricolage Grotesque"; src: url("assets/fonts/Bricolage.woff2") format("woff2"); font-weight: 200 800; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 100 800; }
      #s1-root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; }
      #s1-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 150px; }
      #s1-title { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 92px; line-height: 1.05; letter-spacing: -0.03em; color: #eef3f9; white-space: nowrap; }
      #s1-title span { display: inline-block; }
      #s1-title .hi { color: #7cc4f5; }
      #s1-panel { margin-top: 70px; width: 1120px; background: #141c28; border: 2px solid #253044; border-radius: 24px; padding: 18px 0; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5); }
      .s1-row { display: flex; align-items: center; gap: 26px; height: 88px; padding: 0 40px; border-bottom: 2px solid #1b2433; }
      .s1-row:last-child { border-bottom: 0; }
      .s1-dot { width: 26px; height: 26px; border-radius: 50%; border: 4px dashed #9daabf; flex: 0 0 26px; display: block; }
      .s1-name { font-family: "JetBrains Mono", monospace; font-size: 34px; color: #eef3f9; flex: 1; }
      .s1-name .wf { color: #9daabf; }
      .s1-pill { font-family: "JetBrains Mono", monospace; font-size: 26px; color: #9daabf; border: 2px solid #253044; border-radius: 9999px; padding: 6px 22px; display: block; }
    </style>
    <div id="s1-stage" class="clip" data-start="0" data-duration="3.5" data-track-index="0">
      <h1 id="s1-title"><span>Where</span> <span>do</span> <span>your</span> <span class="hi">GitHub</span> <span class="hi">Actions</span> <span>jobs</span> <span>run?</span></h1>
      <div id="s1-panel">
        <div class="s1-row"><i class="s1-dot"></i><div class="s1-name"><span class="wf">ci /</span> build</div><b class="s1-pill">queued</b></div>
        <div class="s1-row"><i class="s1-dot"></i><div class="s1-name"><span class="wf">ci /</span> test (1/3)</div><b class="s1-pill">queued</b></div>
        <div class="s1-row"><i class="s1-dot"></i><div class="s1-name"><span class="wf">ci /</span> test (2/3)</div><b class="s1-pill">queued</b></div>
        <div class="s1-row"><i class="s1-dot"></i><div class="s1-name"><span class="wf">ci /</span> test (3/3)</div><b class="s1-pill">queued</b></div>
        <div class="s1-row"><i class="s1-dot"></i><div class="s1-name"><span class="wf">ci /</span> e2e</div><b class="s1-pill">queued</b></div>
      </div>
    </div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="s1-queue"]');
      const words = root.querySelectorAll("#s1-title span");
      words.forEach((w, i) => tl.fromTo(w, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.04 * i));
      tl.fromTo("#s1-panel", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 0.15);
      // One row lands on each beat, 0.5 s to 2.5 s.
      root.querySelectorAll(".s1-row").forEach((row, i) => {
        const beat = 0.5 * (i + 1);
        tl.fromTo(row, { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.in" }, beat - 0.22);
        tl.fromTo(row.querySelector(".s1-pill"), { scale: 1.25 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, beat);
      });
      // The queued markers keep turning: nothing has picked the jobs up.
      tl.fromTo(root.querySelectorAll(".s1-dot"), { rotation: 0 }, { rotation: 360, duration: 3.5, ease: "none" }, 0);
      tl.fromTo(root.querySelectorAll(".s1-pill"), { opacity: 1 }, { opacity: 0.55, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.5);
      window.__timelines["s1-queue"] = tl;
    })();
  </script>
</template>
