<template id="s5-pricing-template">
  <div id="s5-root" data-composition-id="s5-pricing" data-width="1920" data-height="1080" data-duration="3.0">
    <style>
      @font-face { font-family: "Schibsted Grotesk"; src: url("assets/fonts/SchibstedGrotesk.woff2") format("woff2"); font-weight: 400 900; }
      @font-face { font-family: "Fragment Mono"; src: url("assets/fonts/FragmentMono.woff2") format("woff2"); font-weight: 400; }
      #s5-root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Schibsted Grotesk", sans-serif; color: #2c3036; }
      #s5-stage { position: absolute; inset: 0; display: flex; justify-content: center; padding-top: 160px; }
      #s5-col { width: 1600px; }
      #s5-h2 { font-weight: 700; font-size: 80px; line-height: 1.08; letter-spacing: -0.03em; color: #15171a; }
      #s5-lead { margin-top: 26px; font-size: 36px; line-height: 1.45; }
      /* The page's plans: two columns under an ink rule, split by a hairline. */
      #s5-plans { position: relative; margin-top: 72px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #s5-rule { position: absolute; left: 0; top: 0; width: 1600px; height: 3px; background: #15171a; transform-origin: 0% 50%; display: block; }
      .s5-plan { display: flex; flex-direction: column; padding: 44px 80px 0 0; }
      .s5-plan + .s5-plan { padding: 44px 0 0 80px; border-left: 1.5px solid #e6e8eb; }
      .s5-plan b { color: #5f6670; font: 400 26px "Fragment Mono", monospace; }
      .s5-plan strong { margin: 16px 0 28px; color: #15171a; font-size: 124px; font-weight: 700; line-height: 1; letter-spacing: -0.04em; }
      .s5-plan ul { list-style: none; }
      .s5-plan li { padding: 14px 0; border-top: 1.5px solid #e6e8eb; font-size: 32px; }
      .s5-plan li:first-child { border-top: 0; }
    </style>
    <div id="s5-stage" class="clip" data-start="0" data-duration="3.0" data-track-index="0">
      <div id="s5-col">
        <h2 id="s5-h2">Pricing</h2>
        <p id="s5-lead">backmesh is free and open source; you pay your clouds for the VMs.</p>
        <div id="s5-plans">
          <i id="s5-rule"></i>
          <div class="s5-plan" id="s5-free"><b>Free</b><strong>$0</strong><ul><li>Open source, Apache-2.0</li><li>Unlimited jobs</li><li>Cache included</li><li>No credit card required</li></ul></div>
          <div class="s5-plan" id="s5-premium"><b>Premium</b><strong>Let's talk</strong><ul><li>Slack monitoring</li><li>Logs</li><li>Runtime history</li></ul></div>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="s5-pricing"]');
      tl.fromTo("#s5-h2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.4);
      tl.fromTo("#s5-lead", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.5);
      tl.fromTo("#s5-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 0.7);
      ["#s5-free", "#s5-premium"].forEach((id, p) => {
        tl.fromTo(root.querySelector(id + " b"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 1.0 + 0.35 * p);
        tl.fromTo(root.querySelector(id + " strong"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.05 + 0.35 * p);
        root.querySelectorAll(id + " li").forEach((li, i) =>
          tl.fromTo(li, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 1.3 + 0.3 * p + 0.1 * i));
      });
      tl.fromTo("#s5-premium", { borderLeftColor: "rgba(230, 232, 235, 0)" }, { borderLeftColor: "rgba(230, 232, 235, 1)", duration: 0.4 }, 1.2);
      window.__timelines["s5-pricing"] = tl;
    })();
  </script>
</template>
