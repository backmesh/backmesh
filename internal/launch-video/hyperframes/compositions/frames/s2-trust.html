<template id="s2-trust-template">
  <div id="s2-root" data-composition-id="s2-trust" data-width="1920" data-height="1080" data-duration="3.2">
    <style>
      @font-face { font-family: "Schibsted Grotesk"; src: url("assets/fonts/SchibstedGrotesk.woff2") format("woff2"); font-weight: 400 900; }
      #s2-root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Schibsted Grotesk", sans-serif; color: #2c3036; }
      #s2-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0 120px; }
      /* The page's trust strip (website/src/components/TrustStrip.astro). */
      #s2-strip { width: 1600px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 80px; padding-top: 64px; border-top: 2px solid #e6e8eb; }
      #s2-rule { position: absolute; left: 0; top: -2px; width: 1600px; height: 2px; background: #15171a; transform-origin: 0% 50%; display: block; }
      #s2-wrap { position: relative; }
      .s2-item { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 16px 26px; align-content: start; }
      .s2-item svg { width: 56px; height: 56px; margin-top: 2px; fill: none; stroke: #0e6ba8; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; display: block; }
      .s2-item b { color: #15171a; font-size: 50px; text-wrap: balance; font-weight: 600; line-height: 1.2; letter-spacing: -0.015em; }
      .s2-item span { grid-column: 2; color: #5f6670; font-size: 36px; line-height: 1.45; }
    </style>
    <div id="s2-stage" class="clip" data-start="0" data-duration="3.2" data-track-index="0">
      <div id="s2-wrap">
        <i id="s2-rule"></i>
        <div id="s2-strip">
          <div class="s2-item"><svg viewBox="0 0 20 20"><path d="M5.5 16a3.5 3.5 0 0 1-.4-7 5 5 0 0 1 9.7-1 4 4 0 0 1-.3 8Z" /></svg><b>No cloud keys stored</b><span>A role from your cloud CLI connects each cloud.</span></div>
          <div class="s2-item"><svg viewBox="0 0 20 20"><path d="M5 9h10v8H5ZM7 9V6a3 3 0 0 1 6 0v3" /></svg><b>Your code never reaches us</b><span>Code, secrets, caches and logs stay between GitHub and your runners.</span></div>
          <div class="s2-item"><svg viewBox="0 0 20 20"><path d="M2 10h4l2-5 4 10 2-5h4" /></svg><b>One small event per job</b><span>It never names the repo, workflow, job or branch.</span></div>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="s2-trust"]');
      tl.fromTo("#s2-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 0.3);
      tl.fromTo("#s2-rule", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power1.out", immediateRender: false }, 1.0);
      root.querySelectorAll(".s2-item").forEach((item, i) =>
        tl.fromTo(item, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.55 + 0.3 * i));
      window.__timelines["s2-trust"] = tl;
    })();
  </script>
</template>
