<template id="s2-bench-template">
  <div id="s2-root" data-composition-id="s2-bench" data-width="1920" data-height="1080" data-duration="4.4">
    <style>
      @font-face { font-family: "Schibsted Grotesk"; src: url("assets/fonts/SchibstedGrotesk.woff2") format("woff2"); font-weight: 400 900; }
      @font-face { font-family: "Fragment Mono"; src: url("assets/fonts/FragmentMono.woff2") format("woff2"); font-weight: 400; }
      #s2-root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Schibsted Grotesk", sans-serif; color: #2c3036; }
      #s2-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #s2-col { width: 1600px; }
      #s2-h2 { font-weight: 700; font-size: 80px; line-height: 1.08; letter-spacing: -0.03em; color: #15171a; }
      #s2-key { margin-top: 40px; display: flex; gap: 48px; font: 400 26px "Fragment Mono", monospace; color: #5f6670; }
      #s2-key span { display: flex; align-items: center; gap: 14px; }
      #s2-key i { width: 30px; height: 20px; display: block; }
      /* One bar pair per workload, on one shared scale (99 s is the longest). */
      #s2-chart { margin-top: 44px; border-top: 3px solid #15171a; padding-top: 22px; }
      .s2-group { display: grid; grid-template-columns: 330px 1270px; align-items: center; padding: 22px 0; }
      .s2-group + .s2-group { border-top: 1.5px solid #e6e8eb; }
      .s2-name { color: #15171a; font-size: 36px; font-weight: 600; letter-spacing: -0.01em; }
      .s2-nb { white-space: nowrap; }
      .s2-note { display: block; margin-top: 6px; font: 400 24px "Fragment Mono", monospace; letter-spacing: 0; color: #0e6ba8; }
      .s2-bars { display: grid; gap: 10px; }
      .s2-row { position: relative; height: 40px; }
      .s2-bar { position: absolute; left: 0; top: 0; bottom: 0; transform-origin: 0% 50%; display: block; }
      .s2-bm { background: #0e6ba8; }
      .s2-gh { background: #0b3557; }
      .s2-val { position: absolute; top: 3px; padding-left: 18px; font: 400 29px "Fragment Mono", monospace; white-space: nowrap; }
      .s2-row.bm .s2-val { color: #0e6ba8; }
      .s2-row.gh .s2-val { color: #15171a; }
    </style>
    <div id="s2-stage" class="clip" data-start="0" data-duration="4.4" data-track-index="0">
      <div id="s2-col">
        <!-- index.astro's speed chart at 784f9f63 (bench.ts): secs [backmesh 4 vCPU, GitHub-hosted] and backmesh's "faster". -->
        <h2 id="s2-h2">Same 4 vCPUs: backmesh vs <span class="s2-nb">GitHub-hosted.</span></h2>
        <div id="s2-key"><span><i class="s2-bm"></i>backmesh, 4 vCPUs</span><span><i class="s2-gh"></i>GitHub-hosted ubuntu-latest, 4 vCPUs</span></div>
        <div id="s2-chart">
          <div class="s2-group" data-bm="57" data-gh="99"><div class="s2-name">Docker build<span class="s2-note">1.7× faster</span></div><div class="s2-bars"><div class="s2-row bm"><i class="s2-bar s2-bm"></i><span class="s2-val">57 s</span></div><div class="s2-row gh"><i class="s2-bar s2-gh"></i><span class="s2-val">99 s</span></div></div></div>
          <div class="s2-group" data-bm="38" data-gh="73"><div class="s2-name">Go<span class="s2-note">1.9× faster</span></div><div class="s2-bars"><div class="s2-row bm"><i class="s2-bar s2-bm"></i><span class="s2-val">38 s</span></div><div class="s2-row gh"><i class="s2-bar s2-gh"></i><span class="s2-val">73 s</span></div></div></div>
          <div class="s2-group" data-bm="28" data-gh="43"><div class="s2-name">TypeScript<span class="s2-note">1.5× faster</span></div><div class="s2-bars"><div class="s2-row bm"><i class="s2-bar s2-bm"></i><span class="s2-val">28 s</span></div><div class="s2-row gh"><i class="s2-bar s2-gh"></i><span class="s2-val">43 s</span></div></div></div>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="s2-bench"]');
      const MAX = 99, W = 1100;
      tl.fromTo("#s2-h2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.4);
      tl.fromTo("#s2-key", { opacity: 0 }, { opacity: 1, duration: 0.35 }, 0.6);
      tl.fromTo("#s2-chart", { borderTopColor: "rgba(21, 23, 26, 0)" }, { borderTopColor: "rgba(21, 23, 26, 1)", duration: 0.35 }, 0.6);
      // Per workload, both bars grow at the same rate: backmesh's stops first.
      root.querySelectorAll(".s2-group").forEach((group, g) => {
        const at = 0.8 + 0.3 * g;
        tl.fromTo(group.querySelector(".s2-name"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, at);
        ["bm", "gh"].forEach((kind) => {
          const secs = +group.dataset[kind];
          const row = group.querySelector(".s2-row." + kind);
          const bar = row.querySelector(".s2-bar");
          const width = (secs / MAX) * W;
          bar.style.width = width + "px";
          row.querySelector(".s2-val").style.left = width + "px";
          const dur = 1.0 * (secs / MAX);
          tl.fromTo(bar, { scaleX: 0 }, { scaleX: 1, duration: dur, ease: "none" }, at + 0.1);
          tl.fromTo(row.querySelector(".s2-val"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" }, at + 0.1 + dur);
        });
      });
      window.__timelines["s2-bench"] = tl;
    })();
  </script>
</template>
