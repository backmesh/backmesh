<template id="s5-log-template">
  <div id="s5-root" data-composition-id="s5-log" data-width="1920" data-height="1080" data-duration="4">
    <style>
      @font-face { font-family: "Bricolage Grotesque"; src: url("assets/fonts/Bricolage.woff2") format("woff2"); font-weight: 200 800; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 100 800; }
      #s5-root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; }
      #s5-stage { position: absolute; inset: 0; padding: 130px 150px 0; }
      #s5-head { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 84px; letter-spacing: -0.03em; color: #eef3f9; line-height: 1.05; white-space: nowrap; }
      #s5-log { margin-top: 64px; width: 1620px; background: #070b11; border: 2px solid #253044; border-radius: 22px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); }
      #s5-step { height: 72px; display: flex; align-items: center; gap: 18px; padding: 0 34px; background: #141c28; border-bottom: 2px solid #253044; font-size: 30px; font-weight: 600; color: #eef3f9; }
      #s5-step .ok { width: 30px; height: 30px; border-radius: 50%; background: #7cc4f5; display: block; }
      #s5-lines { padding: 26px 0 30px; font-family: "JetBrains Mono", monospace; font-size: 31px; line-height: 1.66; color: #eef3f9; }
      .s5-l { display: flex; white-space: pre; }
      .s5-n { width: 110px; padding-right: 30px; text-align: right; color: #52607a; flex: 0 0 110px; }
      .s5-l .hi { color: #7cc4f5; }
      #s5-cite { margin-top: 26px; font-size: 26px; color: #9daabf; }
    </style>
    <div id="s5-stage" class="clip" data-start="0" data-duration="4" data-track-index="0">
      <div id="s5-head">Every job log ends with what it used.</div>
      <div id="s5-log">
        <div id="s5-step"><i class="ok"></i>Complete runner</div>
        <!-- Verbatim from backmesh CI run 42915065644, job verify (README.md, "Job log"). -->
        <div id="s5-lines">
          <div class="s5-l"><span class="s5-n">1</span><span><span class="hi">backmesh:</span> resources over 61 s, sampled every 5 s; Docker containers not counted</span></div>
          <div class="s5-l"><span class="s5-n">2</span><span>  Memory  <span class="hi">peak 1.7 GiB</span>, page cache excluded; 0 OOM kills</span></div>
          <div class="s5-l"><span class="s5-n">3</span><span>  CPU     <span class="hi">average 2.09 cores</span>, peak 3.30</span></div>
          <div class="s5-l"><span class="s5-n">4</span><span>          waiting for CPU 4.7 s, avg10 peak 12.03 %</span></div>
          <div class="s5-l"><span class="s5-n">5</span><span>  Disk    work directory <span class="hi">peak 0.6 GiB</span>, every 30 s; Docker storage not counted</span></div>
        </div>
      </div>
      <div id="s5-cite">From backmesh's own CI: a verify job on backmesh-4, AWS, Nov 10 2026</div>
    </div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="s5-log"]');
      tl.fromTo("#s5-head", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.3);
      tl.fromTo("#s5-log", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.55);
      // One line per beat, 1.0 s to 3.0 s (15.5 s to 17.5 s).
      root.querySelectorAll(".s5-l").forEach((line, i) => {
        tl.fromTo(line, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.2, ease: "power2.out" }, 1.0 + 0.5 * i);
      });
      tl.fromTo("#s5-cite", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.1);
      window.__timelines["s5-log"] = tl;
    })();
  </script>
</template>
