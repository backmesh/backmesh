<template id="s3-bench-template">
  <div id="s3-root" data-composition-id="s3-bench" data-width="1920" data-height="1080" data-duration="5">
    <style>
      @font-face { font-family: "Schibsted Grotesk"; src: url("assets/fonts/SchibstedGrotesk.woff2") format("woff2"); font-weight: 400 900; }
      @font-face { font-family: "Fragment Mono"; src: url("assets/fonts/FragmentMono.woff2") format("woff2"); font-weight: 400; }
      #s3-root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Schibsted Grotesk", sans-serif; color: #2c3036; }
      #s3-stage { position: absolute; inset: 0; display: flex; justify-content: center; padding-top: 150px; }
      #s3-col { width: 1600px; }
      #s3-h2 { font-weight: 700; font-size: 80px; line-height: 1.08; letter-spacing: -0.03em; color: #15171a; }
      #s3-lead { margin-top: 26px; font-size: 32px; line-height: 1.45; }
      #s3-lead code { font: 400 0.9em "Fragment Mono", monospace; color: #15171a; }
      /* The page's benchmark cards: the pricing cards, three across. */
      #s3-cards { position: relative; margin-top: 60px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      #s3-rule { position: absolute; left: 0; top: 0; width: 1600px; height: 3px; background: #15171a; transform-origin: 0% 50%; display: block; }
      .s3-card { display: flex; flex-direction: column; padding: 40px 48px 0; border-left: 1.5px solid #e6e8eb; }
      .s3-card:first-child { padding-left: 0; border-left: 0; }
      .s3-card:last-child { padding-right: 0; }
      .s3-card b { color: #5f6670; font: 400 26px "Fragment Mono", monospace; }
      .s3-card strong { margin: 14px 0 22px; color: #15171a; font-size: 116px; font-weight: 700; line-height: 1; letter-spacing: -0.04em; }
      .s3-run { margin-bottom: 22px; color: #5f6670; font-size: 25px; line-height: 1.45; }
      .s3-card ul { list-style: none; }
      .s3-card li { padding: 12px 0; border-top: 1.5px solid #e6e8eb; font-size: 27px; line-height: 1.4; }
      .s3-card li:first-child { border-top: 0; }
      /* The page links each number to its benchmark row, in the accent. */
      .s3-a { color: #0e6ba8; }
    </style>
    <div id="s3-stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
      <div id="s3-col">
        <!-- index.astro's benchmarks array (2026-11-18, medians of 5 rounds each). -->
        <h2 id="s3-h2">Builds against GitHub's ubuntu-latest.</h2>
        <p id="s3-lead">Median of 5 runs each, a <code>backmesh-4</code> spot VM on AWS against GitHub-hosted <code>ubuntu-latest</code>.</p>
        <div id="s3-cards">
          <i id="s3-rule"></i>
          <div class="s3-card">
            <b>Docker build</b><strong>71 s</strong>
            <span class="s3-run">on backmesh-4, plus <span class="s3-a">48 s</span> before the job starts, about <span class="s3-a">17 s</span> when cued</span>
            <ul><li>grafana/k6 v0.54.0 image</li><li><span class="s3-a">148 s</span> on GitHub-hosted: <span class="s3-a">2.1×</span> faster</li><li><span class="s3-a">$0.0032</span> a build, against <span class="s3-a">$0.018</span>: <span class="s3-a">5.5×</span> cheaper</li></ul>
          </div>
          <div class="s3-card">
            <b>Rust</b><strong>49 s</strong>
            <span class="s3-run">on backmesh-4, plus <span class="s3-a">50 s</span> before the job starts, about <span class="s3-a">17 s</span> when cued</span>
            <ul><li>ripgrep 14.1.1, cargo build --release</li><li><span class="s3-a">70 s</span> on GitHub-hosted: <span class="s3-a">1.4×</span> faster</li><li><span class="s3-a">$0.0027</span> a build, against <span class="s3-a">$0.012</span>: <span class="s3-a">4.4×</span> cheaper</li></ul>
          </div>
          <div class="s3-card">
            <b>TypeScript</b><strong>35 s</strong>
            <span class="s3-run">on backmesh-4, plus <span class="s3-a">43 s</span> before the job starts, about <span class="s3-a">17 s</span> when cued</span>
            <ul><li>TypeScript v5.6.3, npm ci and hereby local</li><li><span class="s3-a">56 s</span> on GitHub-hosted: <span class="s3-a">1.6×</span> faster</li><li><span class="s3-a">$0.0021</span> a build, against <span class="s3-a">$0.006</span>: <span class="s3-a">2.8×</span> cheaper</li></ul>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="s3-bench"]');
      tl.fromTo("#s3-h2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.4);
      tl.fromTo("#s3-lead", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.55);
      tl.fromTo("#s3-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 0.7);
      // One card per workload, in turn: the time, then its comparison.
      root.querySelectorAll(".s3-card").forEach((card, c) => {
        const at = 1.0 + 0.3 * c;
        tl.fromTo(card.querySelector("b"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, at - 0.05);
        tl.fromTo(card.querySelector("strong"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at);
        tl.fromTo(card.querySelector(".s3-run"), { opacity: 0 }, { opacity: 1, duration: 0.35 }, at + 0.2);
        card.querySelectorAll("li").forEach((li, i) =>
          tl.fromTo(li, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, at + 0.4 + 0.12 * i));
      });
      window.__timelines["s3-bench"] = tl;
    })();
  </script>
</template>
