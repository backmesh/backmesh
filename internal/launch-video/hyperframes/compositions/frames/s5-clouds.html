<template id="s5-clouds-template">
  <div id="s5-root" data-composition-id="s5-clouds" data-width="1920" data-height="1080" data-duration="3.9">
    <style>
      @font-face { font-family: "Schibsted Grotesk"; src: url("assets/fonts/SchibstedGrotesk.woff2") format("woff2"); font-weight: 400 900; }
      @font-face { font-family: "Fragment Mono"; src: url("assets/fonts/FragmentMono.woff2") format("woff2"); font-weight: 400; }
      #s5-root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Schibsted Grotesk", sans-serif; color: #2c3036; }
      #s5-stage { position: absolute; inset: 0; display: flex; justify-content: center; padding-top: 210px; }
      #s5-col { width: 1600px; }
      #s5-h2 { font-weight: 700; font-size: 80px; line-height: 1.08; letter-spacing: -0.03em; color: #15171a; }
      #s5-p { margin-top: 26px; max-width: 1400px; font-size: 36px; line-height: 1.45; }
      /* The page's CloudLanes: the matrix, then one lane per cloud. */
      #s5-fig { margin-top: 76px; display: grid; grid-template-columns: 790px minmax(0, 1fr); column-gap: 70px; align-items: start; }
      #s5-code { padding: 6px 0 6px 34px; border-left: 3px solid #e6e8eb; font: 400 30px/1.75 "Fragment Mono", monospace; color: #2c3036; white-space: pre; }
      #s5-code b { color: #0e6ba8; font-weight: 400; }
      #s5-lanes { list-style: none; border-top: 3px solid #15171a; }
      .s5-lane { display: flex; align-items: center; gap: 24px; height: 92px; border-bottom: 1.5px solid #e6e8eb; }
      .s5-lane img { width: 34px; height: 34px; display: block; flex: none; }
      .s5-lane code { flex: 1; font: 400 30px "Fragment Mono", monospace; color: #15171a; }
      .s5-job { display: flex; align-items: center; gap: 14px; color: #0e6ba8; font: 400 28px "Fragment Mono", monospace; }
      .s5-job i { width: 22px; height: 22px; background: #0e6ba8; display: block; }
    </style>
    <div id="s5-stage" class="clip" data-start="0" data-duration="3.9" data-track-index="0">
      <div id="s5-col">
        <h2 id="s5-h2">Pick the cloud per workflow.</h2>
        <p id="s5-p">Each label runs in one cloud. Out of spot capacity, the next VM type launches, never the next cloud.</p>
        <div id="s5-fig">
          <pre id="s5-code">strategy:
  matrix:
    cloud: [aws, gcp, azure]
runs-on: <b>backmesh-${{ matrix.cloud }}-4</b></pre>
          <ul id="s5-lanes">
            <li class="s5-lane"><img src="assets/brand/aws.svg" alt="" /><code>backmesh-aws-4</code><span class="s5-job"><i></i>test · aws</span></li>
            <li class="s5-lane"><img src="assets/brand/gcp.svg" alt="" /><code>backmesh-gcp-4</code><span class="s5-job"><i></i>test · gcp</span></li>
            <li class="s5-lane"><img src="assets/brand/azure.svg" alt="" /><code>backmesh-azure-4</code><span class="s5-job"><i></i>test · azure</span></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="s5-clouds"]');
      tl.fromTo("#s5-h2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.4);
      tl.fromTo("#s5-p", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.5);
      tl.fromTo("#s5-code", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.9);
      tl.fromTo("#s5-lanes", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.1);
      // The matrix's three jobs land in their clouds' lanes in turn.
      root.querySelectorAll(".s5-job").forEach((j, i) =>
        tl.fromTo(j, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 1.6 + 0.3 * i));
      window.__timelines["s5-clouds"] = tl;
    })();
  </script>
</template>
