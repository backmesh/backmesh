<template id="s4-cue-template">
  <div id="s4-root" data-composition-id="s4-cue" data-width="1920" data-height="1080" data-duration="5">
    <style>
      @font-face { font-family: "Bricolage Grotesque"; src: url("assets/fonts/Bricolage.woff2") format("woff2"); font-weight: 200 800; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 100 800; }
      #s4-root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; }
      #s4-stage { position: absolute; inset: 0; padding: 120px 150px 0; }
      #s4-term { width: 1620px; background: #070b11; border: 2px solid #253044; border-radius: 22px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); }
      #s4-bar { height: 50px; background: #141c28; border-bottom: 2px solid #253044; display: flex; align-items: center; gap: 12px; padding: 0 22px; }
      .s4-dot { width: 15px; height: 15px; border-radius: 50%; background: #253044; display: block; }
      #s4-body { padding: 28px 40px 30px; font-family: "JetBrains Mono", monospace; font-size: 44px; line-height: 1.5; color: #eef3f9; white-space: pre; }
      #s4-body .p { color: #9da9bc; }
      #s4-body .c { color: #7cc4f5; }
      #s4-caret { display: inline-block; width: 22px; height: 50px; background: #7cc4f5; vertical-align: -8px; }
      #s4-out { color: #9da9bc; }
      #s4-head { margin-top: 64px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 84px; letter-spacing: -0.03em; color: #eef3f9; line-height: 1.05; white-space: nowrap; }
      #s4-median { margin-top: 18px; font-size: 44px; font-weight: 600; color: #9daabf; white-space: nowrap; }
      #s4-median b { color: #7cc4f5; font-weight: 700; }
      #s4-bars { margin-top: 36px; display: flex; flex-direction: column; gap: 22px; }
      .s4-row { display: flex; align-items: center; gap: 30px; height: 64px; }
      .s4-label { width: 220px; font-size: 32px; font-weight: 600; color: #9daabf; text-align: right; }
      .s4-bar { height: 56px; border-radius: 10px; transform-origin: 0% 50%; display: block; }
      #s4-bar-off { width: 1100px; background: #253044; }
      /* 17 / 100.5 of the 1100 px bar. */
      #s4-bar-on { width: 186px; background: #7cc4f5; }
      .s4-val { font-family: "JetBrains Mono", monospace; font-size: 38px; font-weight: 700; color: #eef3f9; }
      #s4-note { position: absolute; left: 150px; bottom: 56px; font-size: 26px; color: #9daabf; }
    </style>
    <div id="s4-stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
      <div id="s4-term">
        <div id="s4-bar"><i class="s4-dot"></i><i class="s4-dot"></i><i class="s4-dot"></i></div>
        <div id="s4-body"><span class="p">$ </span><span id="s4-cmd"></span><span id="s4-caret"></span>
<span id="s4-out">Cued backmesh/backmesh feat/launch-video.</span></div>
      </div>
      <div id="s4-head">Runners start before you push.</div>
      <div id="s4-median">Median wait: <b>100.5 s → 17 s</b></div>
      <div id="s4-bars">
        <div class="s4-row"><div class="s4-label">No cue</div><i id="s4-bar-off" class="s4-bar"></i><span id="s4-val-off" class="s4-val">100.5 s</span></div>
        <div class="s4-row"><div class="s4-label">With cue</div><i id="s4-bar-on" class="s4-bar"></i><span id="s4-val-on" class="s4-val">17 s</span></div>
      </div>
      <div id="s4-note">Median queue wait, 24 jobs each, on AWS, backmesh's own CI, Nov 2026</div>
    </div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Type the command from 0.45 s; Enter on the beat at 1.0 s (11.0 s).
      const CMD = "backmesh cue --in 120";
      const cmd = document.getElementById("s4-cmd");
      const parts = [["backmesh", "c"], [" cue --in 120", ""]];
      let n = 0;
      parts.forEach(([text, cls]) => {
        for (const ch of text) {
          const s = document.createElement("span");
          s.textContent = ch;
          if (cls) s.className = cls;
          cmd.appendChild(s);
          tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.45 + n * (0.5 / CMD.length));
          n++;
        }
      });
      tl.fromTo("#s4-term", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.25);
      tl.fromTo("#s4-caret", { opacity: 1 }, { opacity: 0, duration: 0.01 }, 1.0);
      tl.fromTo("#s4-out", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 1.0);
      tl.fromTo("#s4-head", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.4);
      tl.fromTo("#s4-median", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 1.85);
      // Bars grow and land on 2.5 s and 3.0 s (12.5 s and 13.0 s).
      tl.fromTo(".s4-label", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.9);
      tl.fromTo("#s4-bar-off", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.in" }, 2.05);
      tl.fromTo("#s4-val-off", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.2 }, 2.5);
      tl.fromTo("#s4-bar-on", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.in" }, 2.7);
      tl.fromTo("#s4-val-on", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.2 }, 3.0);
      tl.fromTo("#s4-bar-on", { scaleY: 1.3 }, { scaleY: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, 3.0);
      tl.fromTo("#s4-note", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 3.5);
      window.__timelines["s4-cue"] = tl;
    })();
  </script>
</template>
