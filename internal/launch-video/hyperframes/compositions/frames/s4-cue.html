<template id="s4-cue-template">
  <div id="s4-root" data-composition-id="s4-cue" data-width="1920" data-height="1080" data-duration="3.9">
    <style>
      @font-face { font-family: "Schibsted Grotesk"; src: url("assets/fonts/SchibstedGrotesk.woff2") format("woff2"); font-weight: 400 900; }
      @font-face { font-family: "Fragment Mono"; src: url("assets/fonts/FragmentMono.woff2") format("woff2"); font-weight: 400; }
      #s4-root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Schibsted Grotesk", sans-serif; color: #2c3036; }
      #s4-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #s4-col { width: 1600px; }
      #s4-h2 { font-weight: 700; font-size: 80px; line-height: 1.08; letter-spacing: -0.03em; color: #15171a; }
      /* The page's CueLanes: the same boot, after the push and before it. */
      #s4-fig { position: relative; margin-top: 76px; padding-top: 76px; display: grid; gap: 70px; }
      #s4-rule { position: absolute; left: 0; top: 0; width: 1600px; height: 3px; background: #15171a; transform-origin: 0% 50%; display: block; }
      .s4-lane { display: grid; grid-template-columns: 290px 1280px; column-gap: 30px; align-items: center; }
      .s4-who { color: #15171a; font-size: 32px; font-weight: 500; }
      .s4-track { position: relative; height: 64px; }
      .s4-seg { position: absolute; top: 6px; height: 52px; display: flex; align-items: center; padding: 0 20px; overflow: hidden; white-space: nowrap; font: 400 25px "Fragment Mono", monospace; transform-origin: 0% 50%; }
      .s4-boot { background: #b9d4e8; color: #15171a; }
      .s4-job { background: #0e6ba8; color: #ffffff; }
      .s4-push { position: absolute; top: -18px; bottom: -6px; width: 3px; background: #15171a; transform-origin: 50% 100%; display: block; }
      .s4-push b { position: absolute; top: -34px; left: -30px; color: #15171a; font: 400 23px "Fragment Mono", monospace; }
    </style>
    <div id="s4-stage" class="clip" data-start="0" data-duration="3.9" data-track-index="0">
      <div id="s4-col">
        <h2 id="s4-h2">The boot happens before the push.</h2>
        <div id="s4-fig">
          <i id="s4-rule"></i>
          <div class="s4-lane">
            <span class="s4-who">Without a cue</span>
            <div class="s4-track">
              <i id="s4-push-a" class="s4-push" style="left: 40%"><b>push</b></i>
              <span id="s4-boot-a" class="s4-seg s4-boot" style="left: 41%; width: 36%">VM boots</span>
              <span id="s4-job-a" class="s4-seg s4-job" style="left: 78%; width: 22%">job runs</span>
            </div>
          </div>
          <div class="s4-lane">
            <span class="s4-who">With a cue</span>
            <div class="s4-track">
              <span id="s4-boot-b" class="s4-seg s4-boot" style="left: 3%; width: 36%">VM boots</span>
              <i id="s4-push-b" class="s4-push" style="left: 40%"><b>push</b></i>
              <span id="s4-job-b" class="s4-seg s4-job" style="left: 41%; width: 46%">job runs</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s4-h2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.4);
      tl.fromTo("#s4-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, 0.45);
      tl.fromTo(".s4-who", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.6);
      // Without a cue: push, then the boot, then the job.
      tl.fromTo("#s4-push-a", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.2, ease: "power2.out" }, 0.7);
      tl.fromTo("#s4-boot-a", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "none" }, 0.85);
      tl.fromTo("#s4-job-a", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 1.32);
      // With a cue: the same boot first, then the push, then the job at once.
      tl.fromTo("#s4-boot-b", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "none" }, 1.7);
      tl.fromTo("#s4-push-b", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.2, ease: "power2.out" }, 2.17);
      tl.fromTo("#s4-job-b", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 2.27);
      window.__timelines["s4-cue"] = tl;
    })();
  </script>
</template>
