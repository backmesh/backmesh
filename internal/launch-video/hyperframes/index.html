    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        // Scenes overlap by 0.4 s: the outgoing one fades while the next
        // begins its own entrance. The end card's band covers the last cut.
        var FADES = [
          { el: "#el-s1-hero", end: 8.4 },
          { el: "#el-s2-trust", end: 11.2 },
          { el: "#el-s3-cost", end: 16.6 },
          { el: "#el-s4-pricing", end: 19.6 },
          { el: "#el-s5-clouds", end: 23.1 },
          { el: "#el-s6-log", end: 26.6 },
        ];
        FADES.forEach(function (f) {
          tl.fromTo(f.el, { opacity: 1, y: 0 }, { opacity: 0, y: -14, duration: 0.4, ease: "power1.in", immediateRender: false }, f.end - 0.4);
        });
        tl.fromTo("#nav-lockup", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.1);
        window.__timelines["main"] = tl;
      })();
