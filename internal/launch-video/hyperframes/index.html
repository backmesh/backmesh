      @font-face { font-family: "Bricolage Grotesque"; src: url("assets/fonts/Bricolage.woff2") format("woff2"); font-weight: 200 800; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter.woff2") format("woff2"); font-weight: 100 900; }
      @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono.woff2") format("woff2"); font-weight: 100 800; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b111a; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0b111a; font-family: "Inter", sans-serif; }
      /* The website's woven bed (tokens.css .bm-bed), at twice its 8 px unit. */
      .bg-layer { position: absolute; pointer-events: none; z-index: 0; }
      #bg-bed {
        inset: -32px;
        background-image:
          repeating-linear-gradient(90deg, rgba(124, 196, 245, 0.07) 0 1px, transparent 1px 16px),
          repeating-linear-gradient(0deg, rgba(238, 243, 249, 0.04) 0 1px, transparent 1px 16px);
      }
      #bg-glow {
        width: 1800px; height: 1800px; left: 60px; top: -900px; border-radius: 50%;
        background: radial-gradient(circle, rgba(124, 196, 245, 0.30) 0%, rgba(124, 196, 245, 0.08) 40%, rgba(124, 196, 245, 0) 68%);
      }
      #bg-vignette { inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(11, 17, 26, 0) 50%, rgba(5, 8, 13, 0.8) 100%); }
      .scene { z-index: 1; position: absolute; inset: 0; }
      /* Weave wipe: twelve bands slide in from alternate sides, cover on the
         beat, and leave the way they came in, so the scenes swap behind them. */
      #weave { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
      .band { position: absolute; left: 0; width: 1920px; height: 90px; display: block; }
      .band.a { background: #141c28; border-top: 2px solid #253044; }
      .band.b { background: #7cc4f5; }
    </style>
  </head>

    </div>

    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        var BEAT = 0.5;
        var END = 22;
        // Weave wipes at each scene boundary: every band is in by a quarter beat
        // after the boundary, when the scenes swap, and out by the next beat.
        var WIPES = [
          { at: 3.0, out: "#el-s1-queue", in: "#el-s2-reveal" },
          { at: 6.5, out: "#el-s2-reveal", in: "#el-s3-bill" },
          { at: 10.0, out: "#el-s3-bill", in: "#el-s4-cue" },
          { at: 14.5, out: "#el-s4-cue", in: "#el-s5-log" },
          { at: 18.0, out: "#el-s5-log", in: "#el-s6-outro" },
        ];
        var bands = Array.from(document.querySelectorAll(".band"));
        bands.forEach(function (band, i) {
          var side = i % 2 ? 1920 : -1920;
          tl.set(band, { x: side }, 0);
          WIPES.forEach(function (w) {
            var lag = i * 0.005;
            tl.fromTo(band, { x: side }, { x: 0, duration: 0.19, ease: "power2.in", immediateRender: false }, w.at + lag);
            tl.fromTo(band, { x: 0 }, { x: -side, duration: 0.19, ease: "power2.out", immediateRender: false }, w.at + 0.26 + lag);
          });
        });
        // Each incoming scene shows only once the bands cover the frame.
        WIPES.forEach(function (w) {
          tl.set(w.in, { opacity: 0 }, 0);
          tl.set(w.in, { opacity: 1 }, w.at + BEAT / 2);
          tl.set(w.out, { opacity: 0 }, w.at + BEAT / 2);
        });
        // The glow breathes on every beat of the 120 BPM grid (44 beats).
        tl.fromTo("#bg-glow", { opacity: 1, scale: 1.04 }, { opacity: 0.7, scale: 1, duration: BEAT, ease: "power2.out", repeat: 43 }, 0);
        tl.fromTo("#bg-bed", { x: 0, y: 0 }, { x: -16, y: -32, duration: END, ease: "none" }, 0);
        tl.to({}, { duration: END }, 0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
