name: E2E

# The inner e2e suite: per label (e2e-labels.yml),
# asserts the cloud and region, the runner image digest, host Docker's limits
# and binds, /dev/kvm on KVM labels, the GPU on GPU labels (nvidia-smi,
# `docker run --gpus all` and a CUDA kernel, timed), arm64 on arm64 labels
# (backmesh-ubuntu-2404-arm-<n>vcpu, named in `labels`), a step's kill of every container sparing
# the runner, and the stop member (backmesh runs 42753183250 and
# 42753320207). Dispatch only.
#
# Without `version`, against our existing installation on `org`, at
# ci-install.yml's pinned release: it changes nothing about it besides the
# stop member's one runner Job, which it ends the same way a reclaim or an
# `uninstall` drain would.
#
# With `version` (a release or release candidate, such as v0.4.3-rc.1), the
# `worker` job checks the Worker release.yml deployed for that tag (the
# staging one on api-staging.backmesh.com for an rc, api.backmesh.com for a
# release) runs that tag's commit, and the `test-org` job, signed in through
# that same Worker, installs that release fresh for `org`,
# the test org (backmesh-dryrun), once per leg: on AWS, running the label
# member; on Azure, in our Azure e2e subscription, with the control plane
# in centralus, running one job; and on GCP, in our GCP CI project, with the
# control plane in us-central1, running one job and one on arm64. Each installs as a customer does, with a
# role connection to its cloud. Each leg then uninstalls it, deletes the
# role connection's setup that uninstall leaves, and sweeps its cloud for
# anything left. With `from` (a release, such as v0.5.7), each leg installs
# that release instead and upgrades it to `version` before the label
# member, as our installations upgrade. Install and uninstall
# each print a GitHub device sign-in, in the run's annotations and summary
# and as a comment on the open "e2e sign-in codes" issue, which an admin of
# the test org approves, as for ci-install.yml. The
# backmesh App stays installed on the test org (`uninstall --keep-app`): only
# an org owner can install it. Every leg runs in the `e2e` environment: AWS
# as AWS_ROLE_ARN, GCP as the service account backmesh-e2e, through its own
# workload identity pool backmesh-e2e, which trusts that environment's OIDC
# subject only (e2e-gcp-identity.yml has its roles and why), and Azure as the managed identity backmesh-e2e (resource
# group backmesh-e2e-identity), which trusts that environment's OIDC subject
# only and holds Contributor and User Access Administrator on the
# subscription: install's seed assigns the control plane's identity
# Contributor and Storage Blob Data Contributor (anycloud's
# seed/azure-template.json, and the roleAssignments/write right
# seed/accounts.ts:138 checks, at v0.1.79), and the role connection's setup
# writes a custom role definition and assigns it. The subscription is e2e's
# alone, apart from production's. GCP's project holds production's GCP setup
# too, so its identity can write there: an accepted risk, kept to the e2e
# environment's reviewers. The owner's
# one-time setup is, in `e2e`, E2E_TEST_ORG_DEPLOY_KEY (a write deploy key
# on the test org's e2e repository), AWS_ROLE_ARN, the identity's
# AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID, the service
# account's GCP_SERVICE_ACCOUNT, GCP_WORKLOAD_IDENTITY_PROVIDER and
# GCP_PROJECT_ID, and that
# repository with test/e2e/test-org/labels.yml as its
# .github/workflows/labels.yml: after a change to the copy merges, a
# maintainer pushes it there; until then the test-org leg fails, naming the
# difference. It
# refuses an org ANYCLOUD_API_URLS names: those are live.

on:
  workflow_dispatch:
    inputs:
      org:
        description: GitHub org the installation is on (ci-install.yml's org), or with `version` the test org it's installed on
        required: true
        default: backmesh
      version:
        description: a release or release candidate (such as v0.4.3-rc.1) to install fresh on `org`, a test org, and uninstall after; empty checks our installation at ci-install.yml's pinned release
        default: ''
      from:
        description: with `version`, a release (such as v0.5.7) each leg installs first and upgrades to `version` from, as our installations will
        default: ''
      labels:
        description: >-
          space-separated label=cloud:region[,region…] entries to check,
          matching the installation's BACKMESH_RUNNERS; a label naming
          "-kvm-" also gets the /dev/kvm check, one naming "-gpu-" the
          GPU check, and one naming "-arm-" the arm64 check
        required: true
        default: >-
          backmesh-ubuntu-2404-4vcpu=aws:us-east-2,us-east-1,us-west-2
          backmesh-ubuntu-2404-kvm-4vcpu=aws:us-east-2,us-east-1,us-west-2
          backmesh-ubuntu-2404-arm-4vcpu=aws:us-east-2,us-east-1,us-west-2
          backmesh-gcp-ubuntu-2404-arm-4vcpu=gcp:us-east4,us-central1,us-east1,us-east5,us-south1,us-west1,us-west2,us-west3,us-west4
      burst:
        description: >-
          with `version`, a burst of this many jobs at once on each leg's
          first label after its label member, to load the control plane: its runner-start figures and the control plane VM's in the
          summary and the burst-<cloud> artifact
          (benchmarks/control-plane-burst); 0 runs none, at most 99
        type: number
        default: 0
      sccache:
        description: >-
          with `version`, the sccache spike's check on each leg's first label
          after its label member and burst: a nushell build through the loopback
          proxy on the job's cache token, across a renewal
          (experiments/sccache), in the summary and the sccache-<cloud> artifact
        type: boolean
        default: false

permissions: {}

# A version run's install makes its subscription's one role connection setup,
# anycloud-role (see the role guard), so version runs queue behind one
# another whatever their test org.
concurrency:
  group: e2e-${{ inputs.version && 'test-org' || inputs.org }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # Reads `version`'s compatibility.json, else the pinned release's
  # (ci-install.yml's own BACKMESH_VERSION, so there's one place that names
  # it), and turns `labels` into the matrix the label and stop jobs run over.
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.pinned.outputs.version }}
      api-url: ${{ steps.pinned.outputs.api-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: ''

      - name: Read the release under test
        id: pinned
        env:
          VERSION: ${{ inputs.version }}
          FROM: ${{ inputs.from }}
        run: |
          if [[ -n $FROM ]]; then
            [[ -n $VERSION && $FROM =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::from takes a release tag, with a version to upgrade to"; exit 1; }
            [[ $FROM != "$VERSION" && $(printf '%s\n' "$FROM" "$VERSION" | sort -V | head -n1) == "$FROM" ]] \
              || { echo "::error::from ($FROM) must be older than version ($VERSION)"; exit 1; }
          fi
          if [[ -n $VERSION ]]; then
            [[ $VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || { echo "::error::$VERSION isn't a release tag"; exit 1; }
            echo "version=$VERSION" >>"$GITHUB_OUTPUT"
            # The Worker release.yml deployed for it.
            api=https://api.backmesh.com
            [[ $VERSION == *-rc.* ]] && api=https://api-staging.backmesh.com
            echo "api-url=$api" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(awk -F': ' '/^ {6}BACKMESH_VERSION:/ { print $2; exit }' .github/workflows/ci-install.yml)
          [[ -n $version ]] || { echo "::error::couldn't read ci-install.yml's BACKMESH_VERSION"; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Download that release's compatibility.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.pinned.outputs.version }}" --repo "$GITHUB_REPOSITORY" \
            --pattern compatibility.json --dir "$RUNNER_TEMP" --clobber

      - name: Plan the label matrix
        id: plan
        env:
          LABELS: ${{ inputs.labels }}
          COMPAT_PATH: ${{ runner.temp }}/compatibility.json
        run: echo "matrix=$(node test/e2e/plan.ts)" >>"$GITHUB_OUTPUT"

  # Assertions 1-4 and the kill-all, on our own org's runners.
  label:
    needs: plan
    if: ${{ !inputs.version }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-labels.yml
    with:
      matrix: ${{ needs.plan.outputs.matrix }}
      ref: ${{ github.sha }}

  # Assertion 5, the stop member: orchestrated from a GitHub-hosted runner,
  # since the label's own runner Job is what gets terminated mid-job.
  # max-parallel 1: one label at a time, so a label's dispatch of
  # lost-runner-check.yml (and of ci-install.yml's stop-runner and diagnose
  # modes, which share ci-install.yml's own singleton `ci-install`
  # concurrency group) never races another label's. After the label jobs,
  # pass or fail: on a new cloud connection their burst can hold boots for
  # many minutes, past the stop member's 5-minute runner wait.
  # Our own org only, for now: it dispatches ci-install.yml, whose
  # environment is our installations'. The test org's stop member comes later.
  stop:
    needs: [plan, label]
    if: ${{ !cancelled() && needs.plan.result == 'success' && !inputs.version }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write # dispatch lost-runner-check.yml and ci-install.yml, and read their runs
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: ${{ matrix.label }}
      ORG: ${{ inputs.org }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: ''

      - name: 'Stop member: terminate the runner Job, GitHub must fail the job within 15 s'
        run: node test/e2e/run-stop-member.ts

  # The Worker the tag's CLI signs in through is the one release.yml deployed
  # for it: a release's CLI is tested against what production runs, an rc's
  # against staging.
  worker:
    needs: plan
    if: ${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      BACKMESH_API_URL: ${{ needs.plan.outputs.api-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The target Worker runs the one built from the tag under test
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: test/e2e/worker-commit.sh

  # A fresh install of `version` on the test org, per leg, then the uninstall
  # and a sweep, whatever came before them. AWS runs the label member; Azure
  # and GCP run one job each. Each leg names its control plane: install under --yes
  # doesn't pick one.
  # One leg at a time: the test org holds one installation. On GitHub's
  # runners: it makes the runners it tests.
  test-org:
    needs: plan
    if: ${{ inputs.version }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - cloud: aws
            placement: --runners aws
            # Not us-east-2: our production control plane is a cluster
            # named backmesh there, in this same account (see the guard).
            control-plane-region: us-west-2
          - cloud: azure
            placement: --runners azure
            # Both control-plane sizes are offered here in our subscription.
            control-plane-region: centralus
            # Our Azure e2e subscription has 3 spot vCPUs per region: back to 4 vCPUs once its quota is raised.
            label: backmesh-ubuntu-2404-2vcpu
          - cloud: gcp
            placement: --runners gcp
            # anycloud finds a GCP cluster by name in the whole project (see
            # its guard), so the region is only where it and the runners go.
            control-plane-region: us-central1
            # The control plane's cloud's labels are plain.
            label: backmesh-ubuntu-2404-4vcpu
            # And an arm64 job, on c4a (then t2a).
            arm-label: backmesh-ubuntu-2404-arm-4vcpu
    runs-on: ubuntu-24.04
    # Holds the legs' secrets, and is the subject each cloud's OIDC trust
    # names (see the header).
    environment: e2e
    timeout-minutes: 240
    permissions:
      contents: read # the release's assets
      id-token: write # the clouds' OIDC sign-ins
      issues: write # the sign-in codes issue
    env:
      ORG: ${{ inputs.org }}
      VERSION: ${{ needs.plan.outputs.version }}
      FROM: ${{ inputs.from }}
      CLOUD: ${{ matrix.cloud }}
      # Where the leg's control plane goes, and AWS's sweep looks.
      CONTROL_PLANE_REGION: ${{ matrix.control-plane-region }}
      # Every sign-in, and the listener install makes, use the Worker the
      # `worker` job checks.
      BACKMESH_API_URL: ${{ needs.plan.outputs.api-url }}
      # Our Azure e2e subscription (ee1e6fe6-…).
      AZURE_SUBSCRIPTION_ID: ${{ matrix.cloud == 'azure' && secrets.AZURE_SUBSCRIPTION_ID || '' }}
      # The GCP leg's role connection, by the IDs anycloud's setup script
      # reads: a pool and service account of the run's own, as GCP keeps a
      # deleted pool's ID for 30 days, and one custom role every run reuses.
      ANYCLOUD_ROLE_POOL: bm-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      ANYCLOUD_ROLE_SERVICE_ACCOUNT: bm-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      ANYCLOUD_ROLE_CUSTOM_ROLE: backmeshE2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: ''

      - name: Refuse a live org
        env:
          URLS: ${{ vars.ANYCLOUD_API_URLS }}
        run: |
          echo "STARTED=$(date -u +%FT%TZ)" >>"$GITHUB_ENV"
          jq -e --arg org "${ORG,,}" '[keys[] | ascii_downcase] | index($org) == null' <<<"$URLS" >/dev/null \
            || { echo "::error::$ORG has a live installation (ANYCLOUD_API_URLS); version installs only on a test org"; exit 1; }

      # The release's own checksums; the binary embeds compatibility.json,
      # whose anycloud backmesh runs its own copy of. With `from`, that
      # release's too, as backmesh-from; `anycloud` on the PATH is
      # `version`'s.
      - name: Install the release's backmesh and anycloud
        id: bin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          # <release> <name>: its backmesh as <name>, and its anycloud.
          get() {
            gh release download "$1" --repo "$GITHUB_REPOSITORY" \
              --pattern backmesh-linux-x64.tar.gz --pattern checksums.txt --pattern compatibility.json
            grep ' backmesh-linux-x64.tar.gz$' checksums.txt | sha256sum -c -
            tar -xzf backmesh-linux-x64.tar.gz backmesh
            [[ $2 == backmesh ]] || mv backmesh "$2"
            anycloud=$(jq -er .anycloud compatibility.json)
            rm backmesh-linux-x64.tar.gz checksums.txt compatibility.json
            gh release download "v$anycloud" --repo anycloud-sh/releases \
              --pattern anycloud-linux-x64.tar.gz --pattern checksums.txt
            grep ' anycloud-linux-x64.tar.gz$' checksums.txt | sha256sum -c -
            tar -xzf anycloud-linux-x64.tar.gz anycloud
            rm anycloud-linux-x64.tar.gz checksums.txt
            install -D -m 755 anycloud ~/.backmesh/bin/"$anycloud"/anycloud
          }
          if [[ -n $FROM ]]; then
            get "$FROM" backmesh-from
            # Uninstall's pick, after an upgrade that didn't move the control plane.
            echo "FROM_ANYCLOUD=$anycloud" >>"$GITHUB_ENV"
          fi
          get "$VERSION" backmesh
          echo "VERSION_ANYCLOUD=$anycloud" >>"$GITHUB_ENV"
          # A release before it can't uninstall without taking the App.
          env -u GH_TOKEN ./backmesh uninstall --help | grep -q -- --keep-app \
            || { echo "::error::$VERSION has no uninstall --keep-app, which this needs"; exit 1; }
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          echo "ANYCLOUD_DIR=$HOME/.anycloud" >>"$GITHUB_ENV"
          echo "BACKMESH_ANYCLOUD_DIR=$HOME/.anycloud" >>"$GITHUB_ENV"

      # Install makes the control plane and the role connection's stack, in
      # the control plane's region, as this role.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: matrix.cloud == 'aws'
        id: aws
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.CONTROL_PLANE_REGION }}
          role-duration-seconds: 14400

      # anycloud finds a cluster by name per region, so install would resume
      # a backmesh cluster already in the leg's region, as v0.5.0-rc.3's did
      # our production control plane's (run 44634950328), and uninstall
      # would then delete it.
      - name: Refuse a region with a backmesh cluster
        if: matrix.cloud == 'aws'
        id: guard
        run: |
          stacks=$(aws --no-cli-pager --output json cloudformation describe-stacks --region "$CONTROL_PLANE_REGION" \
            | jq -r '.Stacks[] | select(any(.Tags[]?; .Key == "anycloud_cluster_name" and .Value == "backmesh")) | .StackName')
          if [[ -n $stacks ]]; then
            printf '::error title=A backmesh cluster in %s::%s\n' "$CONTROL_PLANE_REGION" $stacks
            exit 1
          fi

      # Install makes the control plane and the role connection's setup as
      # this identity. Only az is signed in, so install can put the control
      # plane on Azure.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: matrix.cloud == 'azure'
        id: azure
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      # The sweep tells this run's resource groups from others' in the
      # subscription by the ones there before it.
      - name: The anycloud resource groups before the install
        if: matrix.cloud == 'azure'
        run: az group list --query "[?tags.anycloud_cluster && starts_with(name, 'anycloud-')].name" --output tsv >"$RUNNER_TEMP/groups-before"
      # A subscription holds one role connection setup, anycloud-role, so
      # one there already is another's: install would take it over, and the
      # cleanup after uninstall would delete it.
      - name: Refuse a subscription with a role connection
        if: matrix.cloud == 'azure'
        id: role-guard
        run: |
          if [[ $(az group exists --name anycloud-role) == true \
            || -n $(az deployment sub list --query "[?name == 'anycloud-role'].name" --output tsv) ]]; then
            echo "::error title=A role connection in the subscription::anycloud-role is there already. If no installation uses it (a run's cleanup that didn't finish), delete it as that cleanup does, in this subscription: az role assignment delete for anycloud-role's identity's assignments, az group delete --name anycloud-role, az role definition delete --name 'Anycloud role connection <subscription ID>', az deployment sub delete --name anycloud-role"
            exit 1
          fi

      # Install makes the control plane and the role connection's setup as
      # this service account, in its project, which gcloud's config names.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: matrix.cloud == 'gcp'
        id: gcp
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: matrix.cloud == 'gcp'
      # anycloud finds a GCP cluster by name in the whole project, by its
      # service account's description, so install would resume a backmesh
      # cluster there and uninstall would delete it. An earlier run's role
      # connection (an active bm-e2e- pool, or a grant of the custom role)
      # is a cleanup that didn't finish, which the sweep would blame on this
      # run.
      - name: Refuse a project with a backmesh cluster or an earlier role connection
        if: matrix.cloud == 'gcp'
        id: gcp-guard
        run: |
          project=$(gcloud config get-value project)
          found=($(gcloud iam service-accounts list --filter='email~^anycloud-' --format=json \
            | jq -r '.[] | select(.description // "" | test("(^| )anycloud_cluster_name=backmesh( |$)")) | "service-account:\(.email)"'))
          found+=($(gcloud iam workload-identity-pools list --location=global --format='value(name.basename())' \
            | sed -n 's/^bm-e2e-.*/pool:&/p'))
          found+=($(gcloud projects get-iam-policy "$project" --format=json \
            | jq -r --arg role "projects/$project/roles/$ANYCLOUD_ROLE_CUSTOM_ROLE" \
              '.bindings[]? | select(.role == $role) | .members[] | "binding:\($role):\(.)"'))
          if ((${#found[@]})); then
            printf '::error title=In the GCP project before this run::%s\n' "${found[@]}"
            echo "::error::A backmesh cluster here is another installation's. An earlier run's role connection, if no installation uses it, goes as this job's cleanup deletes it: its pool's providers and the pool, the account's grant of $ANYCLOUD_ROLE_CUSTOM_ROLE, and the account."
            exit 1
          fi

      # Nobody can read a running job's annotations or log through GitHub's
      # API, so with-sign-in.sh also comments each code here, where GitHub
      # notifies the owner. One open issue for every run, opened by a run:
      # the oldest, by the author gh's JSON names, as its --author finds no
      # app's issue. Without it, the codes are in the annotations and
      # summary only.
      - name: The sign-in codes issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: e2e sign-in codes
        run: |
          url=
          if ! issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,title,author \
            | jq -r --arg title "$TITLE" 'map(select(.title == $title and .author.login == "app/github-actions"))
              | min_by(.number).number // empty') \
            || { [[ -z $issue ]] && ! url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body "e2e.yml's test-org job comments each GitHub device sign-in here, for an admin of the test org to approve."); }; then
            echo "::warning::Couldn't find or open the \"$TITLE\" issue: the sign-in codes are in the annotations and summary only"
            exit 0
          fi
          echo "SIGN_IN_ISSUE=${issue:-${url##*/}}" >>"$GITHUB_ENV"

      # A maintainer who is an admin of the test org approves install's
      # GitHub sign-in from the run's annotations or summary, or the issue
      # (with-sign-in.sh); the same sign-in is the control plane's. The plan
      # names where the control plane goes, which uninstall uses, and Azure's
      # runner regions, which its one job checks. The release's binaries
      # read GitHub with the job's token, as GH_TOKEN: a shared runner's IP
      # soon spends GitHub's 60 anonymous reads an hour, and backmesh takes
      # GITHUB_TOKEN for the control plane's sign-in, which the job's token
      # isn't. That token writes issues: an accepted risk, as the binaries
      # hold the leg's cloud credentials already. ISSUE_TOKEN, the same
      # token, goes to with-sign-in.sh's comments only.
      - name: backmesh install
        id: install
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TOKEN: ${{ github.token }}
          PLACEMENT: ${{ matrix.placement }}
          LABEL: ${{ matrix.label }}
          ARM_LABEL: ${{ matrix.arm-label }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          t=$ISSUE_TOKEN
          unset ISSUE_TOKEN
          bm=backmesh
          [[ -z $FROM ]] || bm=backmesh-from
          read -ra placement <<<"$PLACEMENT"
          if [[ -n $CONTROL_PLANE_REGION ]]; then placement+=(--control-plane "$CLOUD:$CONTROL_PLANE_REGION"); fi
          plan=$($bm install --org "$ORG" "${placement[@]}" --plan --json) || { echo "$plan"; exit 1; }
          plan=$(tail -n1 <<<"$plan")
          id=$(jq -er .planId <<<"$plan") || { echo "$plan"; exit 1; }
          echo "CONTROL_PLANE=$(jq -er '.controlPlane | "\(.cloud):\(.region)"' <<<"$plan")" >>"$GITHUB_ENV"
          # AWS runs `labels`' AWS ones: its install has no other cloud's.
          if [[ $CLOUD == aws ]]; then
            MATRIX=$(jq -c '{include: [.include[] | select(.cloud == "aws")]}' <<<"$MATRIX")
          else
            MATRIX=$(jq -c --argjson plan "$plan" --arg label "$LABEL" --arg arm "${ARM_LABEL:-}" --arg cloud "$CLOUD" '
              [$plan.runners[] | select(.cloud == $cloud) | .regions[]] as $regions
              | .include[0] as $base
              | {include: ([$label] + (if $arm == "" then [] else [$arm] end) | map($base + {label: ., cloud: $cloud,
                  regions: $regions, kvm: false, gpu: false, arm: (. == $arm)}))}' <<<"$MATRIX")
          fi
          echo "LABEL_MATRIX=$MATRIX" >>"$GITHUB_ENV"
          ISSUE_TOKEN=$t test/e2e/with-sign-in.sh $bm install --org "$ORG" "${placement[@]}" --yes --plan-id "$id"

      # With `from`, `version` upgrades what that release installed, before
      # the label member runs on it (not also before: the upgrade's pause
      # holds no queued work here); any sign-in it asks for is approved as
      # install's is. A control plane behind `version` refuses `--plan`, so
      # `--yes` moves it first, and a change that needs agreement after the
      # move stops it with exit 2, for the plan.
      - name: backmesh upgrade
        id: upgrade
        if: env.FROM
        timeout-minutes: 90
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TOKEN: ${{ github.token }}
        run: |
          t=$ISSUE_TOKEN
          unset ISSUE_TOKEN
          ISSUE_TOKEN=$t test/e2e/with-sign-in.sh backmesh upgrade --yes && exit 0 || code=$?
          ((code == 2)) || exit "$code"
          plan=$(backmesh upgrade --plan --json) || { echo "$plan"; exit 1; }
          id=$(tail -n1 <<<"$plan" | jq -er .planId) || { echo "$plan"; exit 1; }
          ISSUE_TOKEN=$t test/e2e/with-sign-in.sh backmesh upgrade --yes --plan-id "$id"

      # The control plane's ID, for the sweep, also after a failed install
      # that got as far as creating it.
      - name: The control plane
        if: ${{ always() && steps.bin.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "ORG_ID=$(gh api "orgs/$ORG" --jq .id)" >>"$GITHUB_ENV"
          [[ -f ~/.anycloud/api-url ]] || { echo "No control plane was created"; exit 0; }
          url=$(anycloud api status --json | jq -r .url)
          id=$(sed -nE 's|^https://([a-z0-9-]+)\.anycloud\.sh/?$|\1|p' <<<"$url")
          echo "Control plane $url"
          echo "CLUSTER_ID=$id" >>"$GITHUB_ENV"

      # The label member, through the test org's own repository, whose
      # runners these are: `labels`' AWS ones on AWS, one job on the leg's
      # label on Azure, and on GCP one on its label and one on its arm64 label.
      # Its
      # write deploy key pushes the run's branch, which starts its labels.yml.
      - name: The label member on the test org's runners
        env:
          DEPLOY_KEY: ${{ secrets.E2E_TEST_ORG_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
          TEST_ORG_REPO: ${{ inputs.org }}/e2e
          MATRIX: ${{ env.LABEL_MATRIX }}
          REF: ${{ github.sha }}
        run: |
          key=$RUNNER_TEMP/test-org-key
          trap 'rm -f "$key"' EXIT
          install -m 600 /dev/null "$key"
          printf '%s\n' "$DEPLOY_KEY" >"$key"
          # GitHub's host keys, over HTTPS with the job's token: anonymous
          # reads from a hosted runner's shared IP soon get 403.
          install -m 700 -d ~/.ssh
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >>~/.ssh/known_hosts
          # GitHub cancels a step by signalling this shell: the script gets
          # it, and deletes its branch before the EXIT trap removes the key.
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes" node test/e2e/run-test-org-labels.ts &
          pid=$!
          trap 'kill -INT $pid; wait $pid' INT TERM
          wait $pid

      # The burst (benchmarks/control-plane-burst), on the leg's first
      # label, while anycloud api status is read every 15 s: an answer that
      # fails or takes over 5 s is the API not serving.
      - name: The burst on the test org's runners
        id: burst
        if: ${{ inputs.burst > 0 }}
        timeout-minutes: 130
        env:
          DEPLOY_KEY: ${{ secrets.E2E_TEST_ORG_DEPLOY_KEY }}
          TARGET_REPO: ${{ inputs.org }}/e2e
          JOBS: ${{ inputs.burst }}
        run: |
          export OUTPUT_DIR=$RUNNER_TEMP/burst-$CLOUD LABEL=$(jq -r '.include[0].label' <<<"$LABEL_MATRIX")
          mkdir -p "$OUTPUT_DIR"
          echo "BURST_STARTED=$(date -u +%FT%TZ)" >>"$GITHUB_ENV"
          key=$RUNNER_TEMP/burst-key
          install -m 600 /dev/null "$key"
          printf '%s\n' "$DEPLOY_KEY" >"$key"
          anycloud=~/.backmesh/bin/$VERSION_ANYCLOUD/anycloud
          while :; do
            if out=$(timeout 5 "$anycloud" api status --json 2>&1); then echo "$(date -u +%T) ok"
            else echo "$(date -u +%T) failed $(tr '\n' ' ' <<<"$out" | cut -c1-300)"; fi
            sleep 15
          done >"$OUTPUT_DIR/api-status.log" &
          probe=$!
          trap 'kill $probe; rm -f "$key"' EXIT
          # A cancel cancels the burst's run and deletes its branch.
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes" node benchmarks/control-plane-burst/run.ts &
          pid=$!
          trap 'kill -INT $pid; wait $pid' INT TERM
          wait $pid
          echo "anycloud api status: $(grep -c ' failed' "$OUTPUT_DIR/api-status.log") of $(wc -l <"$OUTPUT_DIR/api-status.log") reads failed" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # The control plane's VM over the burst, once its cloud's metrics have
      # caught up: on AWS, its CPU and credits (the VM of anycloud's
      # documented stack anycloud-<id>); on GCP, memory (the balloon
      # driver's) and CPU of the sweep's anycloud-cluster-<id> VM. A record only.
      - name: The control plane VM over the burst
        if: ${{ always() && steps.burst.outcome != 'skipped' && env.BURST_STARTED && env.CLUSTER_ID && (matrix.cloud == 'aws' || matrix.cloud == 'gcp') }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          dir=$RUNNER_TEMP/burst-$CLOUD
          eval "$(node test/e2e/sweep-names.ts)"
          sleep 240
          start=$(date -u -d "$BURST_STARTED 10 minutes ago" +%FT%TZ) end=$(date -u +%FT%TZ)
          if [[ $CLOUD == aws ]]; then
            id=$(aws ec2 describe-instances --region "$CONTROL_PLANE_REGION" --filters "Name=tag:aws:cloudformation:stack-name,Values=$STACK" \
              --query 'Reservations[].Instances[].InstanceId' --output text)
            for m in CPUUtilization CPUCreditBalance; do
              aws cloudwatch get-metric-statistics --region "$CONTROL_PLANE_REGION" --namespace AWS/EC2 --metric-name "$m" \
                --dimensions "Name=InstanceId,Value=$id" --start-time "$start" --end-time "$end" --period 300 \
                --statistics Minimum Maximum --output json >"$dir/$m.json"
              jq -r --arg m "$m" '"\($m): min \([.Datapoints[].Minimum] | min), max \([.Datapoints[].Maximum] | max)"' "$dir/$m.json"
            done
          else
            project=$(gcloud config get-value project)
            token=$(gcloud auth print-access-token)
            gcloud compute instances list --filter="name=anycloud-cluster-$CLUSTER_ID" \
              --format='value(id,name,machineType.basename())' | while read -r id name type; do
              for m in memory/balloon/ram_used memory/balloon/ram_size cpu/utilization; do
                curl -fsSG -H "Authorization: Bearer $token" "https://monitoring.googleapis.com/v3/projects/$project/timeSeries" \
                  --data-urlencode "filter=metric.type=\"compute.googleapis.com/instance/$m\" AND resource.labels.instance_id=\"$id\"" \
                  --data-urlencode "interval.startTime=$start" --data-urlencode "interval.endTime=$end" >"$dir/$name-${m//\//-}.json"
                jq -r --arg m "$name ($type) $m" '"\($m): max \([.timeSeries[]?.points[].value | .int64Value // .doubleValue | tonumber] | max)"' \
                  "$dir/$name-${m//\//-}.json"
              done
            done
          fi | tee "$dir/vm.txt"
          { echo '```'; cat "$dir/vm.txt"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the burst's figures
        if: ${{ always() && steps.burst.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: burst-${{ matrix.cloud }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/burst-${{ matrix.cloud }}/
          if-no-files-found: warn

      # The sccache spike's check (experiments/sccache), on the leg's first
      # label: the proxy on this cloud's per-job token, across a renewal.
      - name: sccache on the test org's runners
        id: sccache
        if: ${{ inputs.sccache }}
        timeout-minutes: 110
        env:
          DEPLOY_KEY: ${{ secrets.E2E_TEST_ORG_DEPLOY_KEY }}
          TARGET_REPO: ${{ inputs.org }}/e2e
        run: |
          export OUTPUT_DIR=$RUNNER_TEMP/sccache-$CLOUD LABEL=$(jq -r '.include[0].label' <<<"$LABEL_MATRIX")
          key=$RUNNER_TEMP/sccache-key
          install -m 600 /dev/null "$key"
          printf '%s\n' "$DEPLOY_KEY" >"$key"
          trap 'rm -f "$key"' EXIT
          # A cancel cancels the check's run and deletes its branch.
          GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes" node experiments/sccache/clouds.ts &
          pid=$!
          trap 'kill -INT $pid; wait $pid' INT TERM
          wait $pid

      - name: Keep the sccache check's figures
        if: ${{ always() && steps.sccache.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sccache-${{ matrix.cloud }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sccache-${{ matrix.cloud }}/
          if-no-files-found: warn

      # Always, after anything that may have made something, cancelled too:
      # everything but the App, and the checkpoint bucket with the rest. Its
      # GitHub sign-in is approved as install's is, and it reads GitHub with
      # the job's token as install does.
      - name: backmesh uninstall
        if: ${{ always() && steps.bin.outcome == 'success' && steps.guard.outcome != 'failure' && steps.role-guard.outcome != 'failure' && steps.gcp-guard.outcome != 'failure' }}
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TOKEN: ${{ github.token }}
        run: |
          t=$ISSUE_TOKEN
          unset ISSUE_TOKEN
          flags=(--org "$ORG" --yes --keep-app --delete-checkpoint-bucket --confirm backmesh)
          bm=backmesh
          # A control plane that doesn't answer, such as a half-made one, is
          # deleted through the cloud CLI; uninstall refuses that for one that
          # does. One an upgrade didn't move is `from`'s to uninstall, as
          # `version`'s is refused by it; when both pin the same anycloud,
          # `version`'s uninstalls, as only it knows its own labels.
          if [[ -f ~/.anycloud/api-url ]]; then
            url=$(anycloud api status --json | jq -r .url) || url=
            if [[ -n $url ]] && ! served=$(curl -fsS --max-time 10 "$url/v1/version"); then
              flags+=(--control-plane "$CONTROL_PLANE")
            elif [[ -n $url && -n ${FROM_ANYCLOUD:-} && $FROM_ANYCLOUD != "$VERSION_ANYCLOUD" && $(jq -r .version <<<"$served") == "$FROM_ANYCLOUD" ]]; then
              bm=backmesh-from
            fi
          fi
          ISSUE_TOKEN=$t test/e2e/with-sign-in.sh $bm uninstall "${flags[@]}"

      # Uninstall leaves each role connection's setup, which trusts only the
      # deleted control plane, and says so. This deletes what anycloud's
      # `credentials delete --apply` (role-connection-teardown.ts at
      # v0.1.79) would have, which needs the control plane. A connection
      # comes only with a control plane; on Azure, the guard found none
      # there before, and on GCP its pool and account are the run's own. It runs after a failed uninstall too, deliberately: the
      # setup is this run's either way, and the sweep still names whatever
      # uninstall left.
      - name: Delete the role connection's setup
        if: ${{ always() && steps.bin.outcome == 'success' && steps.guard.outcome != 'failure' && steps.role-guard.outcome != 'failure' && steps.gcp-guard.outcome != 'failure' }}
        timeout-minutes: 30
        run: |
          if [[ $CLOUD == aws ]]; then
            [[ -n ${CLUSTER_ID:-} ]] || { echo "No control plane, so no role connection"; exit 0; }
            eval "$(node test/e2e/sweep-names.ts)"
            for verb in delete-stack 'wait stack-delete-complete'; do
              aws cloudformation $verb --region "$CONTROL_PLANE_REGION" --stack-name "$ROLE_STACK"
            done
            exit 0
          fi
          if [[ $CLOUD == gcp ]]; then
            project=$(gcloud config get-value project)
            account=$ANYCLOUD_ROLE_SERVICE_ACCOUNT@$project.iam.gserviceaccount.com
            role=projects/$project/roles/$ANYCLOUD_ROLE_CUSTOM_ROLE
            pool=(--workload-identity-pool="$ANYCLOUD_ROLE_POOL" --location=global)
            # Active pools only: a deleted one is done.
            pools=$(gcloud iam workload-identity-pools list --location=global --format='value(name.basename())')
            if grep -qx -- "$ANYCLOUD_ROLE_POOL" <<<"$pools"; then
              for provider in $(gcloud iam workload-identity-pools providers list "${pool[@]}" --format='value(name.basename())'); do
                gcloud iam workload-identity-pools providers delete "$provider" "${pool[@]}" --quiet
              done
              gcloud iam workload-identity-pools delete "$ANYCLOUD_ROLE_POOL" --location=global --quiet
            fi
            # The grant before the account: a deleted account's stays, as a
            # deleted: member. The custom role stays for the next run.
            policy=$(gcloud projects get-iam-policy "$project" --format=json)
            if jq -e --arg role "$role" --arg member "serviceAccount:$account" \
              'any(.bindings[]?; .role == $role and any(.members[]; . == $member))' <<<"$policy" >/dev/null; then
              gcloud projects remove-iam-policy-binding "$project" --member="serviceAccount:$account" --role="$role" --all --quiet
            fi
            [[ -z $(gcloud iam service-accounts list --filter="email=$account" --format='value(email)') ]] \
              || gcloud iam service-accounts delete "$account" --quiet
            exit 0
          fi
          scope=/subscriptions/$AZURE_SUBSCRIPTION_ID
          role="Anycloud role connection $AZURE_SUBSCRIPTION_ID"
          if [[ $(az group exists --name anycloud-role) == true ]]; then
            # A setup that failed partway may have no identity; its group
            # goes all the same.
            principal=$(az identity show --resource-group anycloud-role --name anycloud-role --query principalId --output tsv) \
              || principal=
            if [[ -n $principal ]]; then
              ids=$(az role assignment list --scope "$scope" --fill-principal-name false \
                --query "[?principalId == '$principal'].id" --output tsv)
              [[ -z $ids ]] || az role assignment delete --ids $ids
            fi
            az group delete --name anycloud-role --yes
          fi
          # Azure keeps a role definition while anything is assigned it; the
          # sweep names it then.
          [[ -z $(az role definition list --name "$role" --scope "$scope" --query '[].name' --output tsv) ]] \
            || az role definition delete --name "$role" --scope "$scope" \
            || echo "::warning::Couldn't delete the role definition $role"
          [[ -z $(az deployment sub list --query "[?name == 'anycloud-role'].name" --output tsv) ]] \
            || az deployment sub delete --name anycloud-role

      # The cost guard: fails, naming them, while anything this run's
      # installation made is still in AWS. Without the control plane's ID,
      # only an anycloud stack created since the run started can be told
      # apart from others' in the account.
      - name: Sweep AWS for anything left
        if: ${{ always() && steps.aws.outcome == 'success' }}
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          left=()
          aws() { command aws --no-cli-pager --output json "$@"; }
          stacks() {
            aws cloudformation list-stacks --region "$CONTROL_PLANE_REGION" \
              --query 'StackSummaries[?StackStatus!=`DELETE_COMPLETE`]' \
              | jq -r --arg started "$STARTED" "$@"
          }
          if [[ -z ${CLUSTER_ID:-} ]]; then
            left+=($(stacks '.[] | select((.StackName | startswith("anycloud-")) and .CreationTime >= $started) | "stack:\(.StackName)"'))
          else
            eval "$(node test/e2e/sweep-names.ts)"
            left+=($(stacks --arg stack "$STACK" --arg role "$ROLE_STACK" \
              '.[] | select(.StackName == $stack or .StackName == $role) | "stack:\(.StackName)"'))
            regions=$( (echo "$CONTROL_PLANE_REGION"; jq -r '.include[] | select(.cloud == "aws") | .regions[]' <<<"$MATRIX") | sort -u)
            for region in $regions; do
              for tag in "anycloud_cluster=$CLUSTER_ID" "anycloud_owner_api=$OWNER_API"; do
                filter="Name=tag:${tag%%=*},Values=${tag#*=}"
                left+=($(aws ec2 describe-instances --region "$region" --filters "$filter" \
                  Name=instance-state-name,Values=pending,running,stopping,stopped,shutting-down \
                  | jq -r --arg r "$region" '.Reservations[].Instances[] | "instance:\($r):\(.InstanceId)"'))
                left+=($(aws ec2 describe-volumes --region "$region" --filters "$filter" \
                  | jq -r --arg r "$region" '.Volumes[] | "volume:\($r):\(.VolumeId)"'))
                left+=($(aws ec2 describe-security-groups --region "$region" --filters "$filter" \
                  | jq -r --arg r "$region" '.SecurityGroups[] | "security-group:\($r):\(.GroupId)"'))
              done
            done
            # Only NoSuchEntity is gone; any other answer fails the sweep.
            iam() {
              local out
              out=$(aws iam "get-$1" --"$1"-name "$2" 2>&1) && { left+=("iam-$1:$2"); return; }
              grep -q NoSuchEntity <<<"$out" || { echo "$out"; echo "::error::couldn't check $1 $2"; exit 1; }
            }
            iam role "anycloud-$CLUSTER_ID-cfn"
            iam role "anycloud-$CLUSTER_ID-vm"
            left+=($(aws s3api list-buckets | jq -r --arg id "$CLUSTER_ID" --arg cache "$CACHE_PREFIX" \
              '.Buckets[].Name | select(contains($id) or startswith($cache)) | "bucket:\(.)"'))
          fi
          if ((${#left[@]})); then
            printf '::error title=Left in AWS::%s\n' "${left[@]}"
            exit 1
          fi
          echo "Nothing of this run's installation is left in AWS."

      # The same guard on Azure: this run's resource groups, anything tagged
      # with its control plane (VMs, disks, IPs, NICs, its managed identity),
      # the identity install generated, and the checkpoint and cache
      # containers. With it, this run's group is anycloud-<id>; without it,
      # an anycloud group made during the run, such as one a failed create
      # left, can only be told apart by not being there before.
      - name: Sweep Azure for anything left
        if: ${{ always() && steps.azure.outcome == 'success' }}
        env:
          ROLE_GUARD: ${{ steps.role-guard.outcome }}
        run: |
          left=()
          # az's empty answer is a blank line, not a name.
          named() { sed -n "s|^.|$1&|p"; }
          before=$RUNNER_TEMP/groups-before
          [[ -f $before ]] || { echo "::error::No list of the resource groups before the install, so this run's can't be told apart"; exit 1; }
          if [[ -z ${CLUSTER_ID:-} ]]; then
            groups=$(az group list --query "[?tags.anycloud_cluster && starts_with(name, 'anycloud-')].name" --output tsv)
            left+=($(comm -13 <(sort "$before") <(sort <<<"$groups") | named resource-group:))
          else
            eval "$(node test/e2e/sweep-names.ts)"
            [[ $(az group exists --name "anycloud-$CLUSTER_ID") == false ]] || left+=("resource-group:anycloud-$CLUSTER_ID")
            for tag in "anycloud_cluster=$CLUSTER_ID" "anycloud_owner_api=$OWNER_API"; do
              left+=($(az resource list --tag "$tag" --query '[].id' --output tsv | named resource:))
            done
            account="anycloud$(tr -d - <<<"$AZURE_SUBSCRIPTION_ID" | cut -c1-8)"
            if [[ $(az storage account check-name --name "$account" --query nameAvailable) == false ]]; then
              left+=($(az storage container-rm list --storage-account "$account" --resource-group anycloud-storage \
                --query "[?name == '$CLUSTER_ID' || starts_with(name, '$CACHE_PREFIX')].name" --output tsv | named container:))
            fi
          fi
          # The role connection's setup, which the guard found none of before;
          # after it refused, the one there is another's.
          if [[ $ROLE_GUARD != failure ]]; then
            [[ $(az group exists --name anycloud-role) == false ]] || left+=(resource-group:anycloud-role)
            left+=($(az deployment sub list --query "[?name == 'anycloud-role'].name" --output tsv | named deployment:))
            left+=($(az role definition list --name "Anycloud role connection $AZURE_SUBSCRIPTION_ID" \
              --scope "/subscriptions/$AZURE_SUBSCRIPTION_ID" --query '[].name' --output tsv | named role-definition:))
          fi
          left=($(printf '%s\n' "${left[@]}" | sort -u))
          if ((${#left[@]})); then
            printf '::error title=Left in Azure::%s\n' "${left[@]}"
            exit 1
          fi
          echo "Nothing of this run's installation is left in Azure."

      # The same guard on GCP: the control plane's VM, firewall rules and
      # service account (anycloud's seed names them for the cluster),
      # anything labelled with the control plane (runner VMs and disks), the
      # checkpoint and cache buckets, and the role connection's setup: the
      # run's pool and account, and any grant left to them or of the custom
      # role. Without the control plane's ID, a backmesh cluster's service
      # account, made first and deleted last, which the guard found none of
      # before.
      - name: Sweep GCP for anything left
        if: ${{ always() && steps.gcp.outcome == 'success' }}
        env:
          GCP_GUARD: ${{ steps.gcp-guard.outcome }}
        run: |
          left=()
          named() { sed -n "s|^.|$1&|p"; }
          project=$(gcloud config get-value project)
          if [[ -z ${CLUSTER_ID:-} ]]; then
            left+=($(gcloud iam service-accounts list --filter='email~^anycloud-' --format=json \
              | jq -r '.[] | select(.description // "" | test("(^| )anycloud_cluster_name=backmesh( |$)")) | "service-account:\(.email)"'))
          else
            eval "$(node test/e2e/sweep-names.ts)"
            vm=anycloud-cluster-$CLUSTER_ID
            filter="name=$vm OR labels.anycloud_cluster=$CLUSTER_ID OR labels.anycloud_owner_api=$OWNER_API"
            left+=($(gcloud compute instances list --filter="$filter" --format='value(name)' | named instance:))
            left+=($(gcloud compute disks list --filter="$filter" --format='value(name)' | named disk:))
            left+=($(gcloud compute firewall-rules list --filter="name~^$vm-" --format='value(name)' | named firewall-rule:))
            left+=($(gcloud storage buckets list --format='value(name)' \
              | awk -v id="$CLUSTER_ID" -v cache="$CACHE_PREFIX" 'index($0, id) || index($0, cache) == 1 { print "bucket:" $0 }'))
            left+=($(gcloud iam service-accounts list --filter="email~^$GCP_ACCOUNT@" --format='value(email)' | named service-account:))
          fi
          left+=($(gcloud iam workload-identity-pools list --location=global --format='value(name.basename())' \
            | sed -n "s/^$ANYCLOUD_ROLE_POOL\$/pool:&/p"))
          # IAM's list keeps a just-deleted account for a while, so give the
          # role connection's teardown up to 2 minutes to show.
          for _ in {1..12}; do
            role_left=$(gcloud iam service-accounts list --filter="email~^$ANYCLOUD_ROLE_SERVICE_ACCOUNT@" --format='value(email)')
            [[ -z $role_left ]] && break
            sleep 10
          done
          left+=($(named service-account: <<<"$role_left"))
          # Grants to the run's accounts, deleted ones included, and, unless
          # the guard found an earlier run's, of the custom role.
          custom=projects/$project/roles/$ANYCLOUD_ROLE_CUSTOM_ROLE
          [[ $GCP_GUARD != failure ]] || custom=
          left+=($(gcloud projects get-iam-policy "$project" --format=json \
            | jq -r --arg custom "$custom" --arg cp "${GCP_ACCOUNT:+$GCP_ACCOUNT@}" --arg rc "$ANYCLOUD_ROLE_SERVICE_ACCOUNT@" \
              '.bindings[]? | .role as $role | .members[]
                | select($role == $custom or contains($rc) or ($cp != "" and contains($cp))) | "binding:\($role):\(.)"'))
          left=($(printf '%s\n' "${left[@]}" | sort -u))
          if ((${#left[@]})); then
            printf '::error title=Left in GCP::%s\n' "${left[@]}"
            exit 1
          fi
          echo "Nothing of this run's installation is left in GCP."

      # Two rcs share the staging Worker: this run tested the tag's Worker
      # only if it's still the one there once the run is done.
      - name: The target Worker still runs the one built from the tag under test
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: test/e2e/worker-commit.sh
