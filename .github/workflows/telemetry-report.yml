name: Telemetry report

# Writes the last 30 days of telemetry, as aggregates only, to the job
# summary (worker/scripts/report.ts). Read-only, and dispatch only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: backmesh-2
    environment: publish
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'

      # The runner image has no yarn (ci.yml).
      - run: npm install --global yarn@1.22.22

      - run: yarn --cwd website install --frozen-lockfile

      - name: Report
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node worker/scripts/report.ts >>"$GITHUB_STEP_SUMMARY"
