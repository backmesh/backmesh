name: E2E labels

# e2e.yml's label member: assertions 1-4 and the kill-all, on the label
# itself, so instance metadata, the VM's own Docker and /dev/kvm are all the
# real thing. Called by e2e.yml for our own org, and by the test org's
# backmesh-dryrun/e2e, whose runners only its own repositories reach
# (e2e.yml's `test-org` job dispatches it). The checks come from
# backmesh/backmesh at `ref` either way: a caller in another repository
# would otherwise check out its own.
on:
  workflow_call:
    inputs:
      matrix:
        description: plan.ts's matrix, as JSON
        type: string
        required: true
      ref:
        description: the backmesh/backmesh commit whose checks run
        type: string
        required: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  label:
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    runs-on: ${{ matrix.label }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: backmesh/backmesh
          ref: ${{ inputs.ref }}

      - name: Cloud and region match the label
        env:
          EXPECTED_CLOUD: ${{ matrix.cloud }}
          EXPECTED_REGIONS: ${{ join(matrix.regions, ',') }}
        run: node test/e2e/check-cloud-region.ts

      - name: Runner image digest matches the release
        env:
          EXPECTED_IMAGE: ${{ matrix.runnerImage }}
        run: node test/e2e/check-image-digest.ts

      - name: Host Docker applies limits and shares /tmp and $HOME
        run: node test/e2e/check-docker-limits.ts

      - name: /dev/kvm is usable
        if: matrix.kvm
        run: node test/e2e/check-kvm.ts

      # The runner is a container on this VM's Docker, which the image's
      # `docker` (runner/docker.sh) leaves out, as GitHub's runners aren't
      # containers. Last: a killed runner fails this job as lost.
      - name: A step's docker kill and rm -f of every container spare the runner
        run: |
          [[ -x /usr/local/libexec/backmesh/docker ]] \
            || { echo "::error::this runner image has no docker wrapper (runner/docker.sh), so the step would kill its runner"; exit 1; }
          for _ in 1 2; do docker run -d mirror.gcr.io/library/busybox:1.37 sleep 300; done
          docker kill $(docker ps -q)
          docker rm -f $(docker ps -aq)
          [[ -z $(docker ps -aq) ]] || { echo "::error::docker rm -f left containers"; docker ps -a; exit 1; }
