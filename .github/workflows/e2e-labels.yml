name: E2E labels

# e2e.yml's label member: assertions 1-4 and the kill-all, on the label
# itself, so instance metadata, the VM's own Docker, /dev/kvm and a GPU
# label's GPU are all the real thing. Called by e2e.yml for our own org, and by the test org's
# backmesh-dryrun/e2e, whose runners only its own repositories reach
# (e2e.yml's `test-org` job dispatches it). The checks come from
# backmesh/backmesh at `ref` either way: a caller in another repository
# would otherwise check out its own.
on:
  workflow_call:
    inputs:
      matrix:
        description: plan.ts's matrix, as JSON
        type: string
        required: true
      ref:
        description: the backmesh/backmesh commit whose checks run
        type: string
        required: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  label:
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    runs-on: ${{ matrix.label }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: backmesh/backmesh
          ref: ${{ inputs.ref }}

      - name: Cloud and region match the label
        env:
          EXPECTED_CLOUD: ${{ matrix.cloud }}
          EXPECTED_REGIONS: ${{ join(matrix.regions, ',') }}
        run: node test/e2e/check-cloud-region.ts

      - name: Runner image digest matches the release
        env:
          EXPECTED_IMAGE: ${{ matrix.runnerImage }}
        run: node test/e2e/check-image-digest.ts

      - name: Host Docker applies limits and shares /tmp and $HOME
        run: node test/e2e/check-docker-limits.ts

      - name: /dev/kvm is usable
        if: matrix.kvm
        run: node test/e2e/check-kvm.ts

      - name: The GPU works in the job and through docker --gpus all
        if: matrix.gpu
        run: node test/e2e/check-gpu.ts

      # The runner is a container on this VM's Docker, which the image's
      # `docker` (runner/docker.sh) leaves out, as GitHub's runners aren't
      # containers. Last: a killed runner fails this job as lost.
      - name: A step's docker kill and rm -f of every container spare the runner
        run: |
          [[ -x /usr/local/libexec/backmesh/docker ]] \
            || { echo "::error::this runner image has no docker wrapper (runner/docker.sh), so the step would kill its runner"; exit 1; }
          for _ in 1 2; do docker run -d mirror.gcr.io/library/busybox:1.37 sleep 300; done
          docker kill $(docker ps -q)
          docker rm -f $(docker ps -aq)
          [[ -z $(docker ps -aq) ]] || { echo "::error::docker rm -f left containers"; docker ps -a; exit 1; }

  # The cache's warm hit: a save uploads after its job, from the runner, so
  # only the next job's restore shows it landed (v0.5.0-v0.5.2 lost every
  # one). Each region has its own bucket, so where the restore's runner
  # landed in another region than the save's it only says so.
  cache-save:
    runs-on: ${{ fromJson(inputs.matrix).include[0].label }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      bucket: ${{ steps.bucket.outputs.bucket }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: backmesh/backmesh
          ref: ${{ inputs.ref }}
      - run: mkdir warm && head -c 100000 /dev/urandom >warm/blob
      - uses: ./cache/save
        with:
          path: warm
          key: e2e-warm-${{ github.run_id }}-${{ github.run_attempt }}
      - id: bucket
        name: The save went to this region's bucket
        run: |
          file=/run/anycloud-secrets/_bm-cache-$RUNNER_NAME/BACKMESH_CACHE
          [[ $(jq -r .state "$file") == ready ]] || { echo "::error::the cache token isn't ready: $(jq -c '{state, reason}' "$file")"; exit 1; }
          echo "bucket=$(jq -r .bucket "$file")" >>"$GITHUB_OUTPUT"

  cache-restore:
    needs: cache-save
    runs-on: ${{ fromJson(inputs.matrix).include[0].label }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: backmesh/backmesh
          ref: ${{ inputs.ref }}
      # The save's runner uploads after its job, so this tries for 5 minutes.
      - name: The next job restores the save
        env:
          SAVED_TO: ${{ needs.cache-save.outputs.bucket }}
          INPUT_PATH: warm
          INPUT_KEY: e2e-warm-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for _ in $(seq 20); do
            # It waits for a pending token, so the file is ready after it.
            node cache/dist/restore.mjs
            [[ -s warm/blob ]] && exit 0
            file=/run/anycloud-secrets/_bm-cache-$RUNNER_NAME/BACKMESH_CACHE
            [[ $(jq -r .state "$file") == ready ]] || { echo "::error::the cache token isn't ready: $(jq -c '{state, reason}' "$file")"; exit 1; }
            bucket=$(jq -r .bucket "$file")
            if [[ $bucket != "$SAVED_TO" ]]; then
              echo "::notice::the save went to $SAVED_TO and this runner reads $bucket, another region's, so the hit isn't checked"
              exit 0
            fi
            sleep 15
          done
          echo "::error::the save never reached the bucket: the runner's upload after the job failed"
          exit 1
