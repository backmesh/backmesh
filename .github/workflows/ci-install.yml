name: CI install

# The CI installations of the orgs whose CI runs on backmesh, anycloud-sh and
# backmesh: `backmesh install` from the released CLI, with our CI's hidden
# override, by hand only. The `upgrade` mode runs `backmesh upgrade`, which
# moves the deployed installation to this release; a re-run of install keeps a
# deployed listener.
# The `diagnose` mode changes nothing: it prints `backmesh status`, the org's
# listener log, and why the last runner Jobs ended. The `uninstall` mode runs
# `backmesh uninstall`, whose one path every run exercises: an org
# admin's sign-in, the drain, the GitHub cleanup, the cloud side and the App's
# removal. Nothing is kept between runs: ANYCLOUD_API_URLS, a repository
# variable, names each org's control plane, and each run signs in to it.
# The owner sets the secrets first (the owner's setup notes).
# A fresh install, an uninstall, and the first upgrade of an install made
# before install keys, stop for backmesh's GitHub sign-in: an admin of the
# org opens the sign-in from the job log before it expires: a code for
# https://github.com/login/device.
# `install` with `plan: true` only prints the plan (`backmesh install --plan`)
# and changes nothing: no sign-in, no billed resource. Preview a clouds change
# with it first, such as one that connects a cloud for the first time, which
# `upgrade` refuses to do.
on:
  workflow_dispatch:
    inputs:
      org:
        description: GitHub org to install on
        required: true
        default: backmesh
      clouds:
        description: the clouds the runners use, space-separated, such as aws gcp; backmesh picks each cloud's runner regions (its fixed US list, less any the account denies), and upgrade drains a cloud left out only with remove-clouds
        required: true
        default: aws
      control-plane:
        description: install, the control plane's <cloud>:<region>; uninstall signs in to its cloud and those in `clouds` to delete the identities install generated
        required: true
        default: aws:us-east-2
      mode:
        description: install; upgrade to move the deployed listener to BACKMESH_VERSION; diagnose to only print the status and the last runner Jobs' ends and logs; uninstall; or stop-runner to terminate one lost-runner check's runner Job
        type: choice
        options: [install, diagnose, upgrade, uninstall, stop-runner]
        default: install
      jobs:
        description: diagnose only, how many of the newest ended runner Jobs to print with their events and logs
        default: '3'
      ids:
        description: diagnose only, runner Job IDs, space-separated, to print the same way whatever their state, each event with its full metadata
        default: ''
      runner:
        description: stop-runner only, the runner Job ID (its runner's name) of an in-progress lost-runner-check job, which is terminated
        default: ''
      plan:
        description: install only, show the plan (backmesh install --plan --json) and exit instead of applying it; asks nothing new of a human and changes nothing billed ("--plan signs in to nothing")
        type: boolean
        default: false
      fresh:
        description: install only, the org has no control plane yet, so ANYCLOUD_API_URLS doesn't name one; install creates it and prints its URL to add there
        type: boolean
        default: false
      remove-clouds:
        description: upgrade only, allow the plan to remove clouds left out of `clouds`
        type: boolean
        default: false
      delete-checkpoint-bucket:
        description: uninstall only, also delete the checkpoint bucket, which holds the control plane's backups; otherwise it's kept
        type: boolean
        default: false

# e2e.yml's stop member dispatches stop-runner and diagnose and must find its
# own run back among any others of this workflow in flight.
run-name: CI install ${{ inputs.mode }} ${{ inputs.runner }}${{ inputs.ids }}

permissions: {}
# bash -eo pipefail: a failed gh api or tar fails its step.
defaults:
  run:
    shell: bash

# One run at a time, never cancelled: a cancelled install, upgrade or
# uninstall stops partway.
concurrency:
  group: ci-install

# The job runs on GitHub-hosted runners, not backmesh's own: this workflow
# repairs, upgrades or reinstalls the installation those runners come from,
# so it must run while they're down.
jobs:
  install:
    runs-on: ubuntu-24.04
    # Holds the secrets, and is the subject each cloud's OIDC trust names.
    environment: ci-install
    timeout-minutes: 120
    permissions:
      contents: read # the release's CLI binary
      id-token: write # each cloud's OIDC sign-in
    env:
      BACKMESH_VERSION: v0.4.1
      # The release's checksums.txt line for backmesh-linux-x64.tar.gz; bump
      # both together. The install step refuses anything but a 64-character
      # digest.
      BACKMESH_SHA256: 860b8401e6069cdcae1e704699648e263c2bdb561e43a9ed7962cd2f9abbedd0
      ANYCLOUD_VERSION: 0.1.78
      ANYCLOUD_SHA256: 5fb5ac58ae549f47738a9e10fda17735987693eeebe5f71ae578d944b36e4ba3
      CLOUDS: ${{ inputs.clouds }}
      CONTROL_PLANE: ${{ inputs.control-plane }}
      ORG: ${{ inputs.org }}
    steps:
      # Released builds only. The binary embeds compatibility.json.
      - name: Install the released backmesh and the pinned anycloud
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ $BACKMESH_SHA256 =~ ^[0-9a-f]{64}$ ]] \
            || { echo "::error::BACKMESH_SHA256 isn't $BACKMESH_VERSION's binary digest"; exit 1; }
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          asset=backmesh-linux-x64.tar.gz
          gh release download "$BACKMESH_VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$asset"
          echo "$BACKMESH_SHA256  $asset" | sha256sum -c -
          tar -xzf "$asset" backmesh && rm "$asset"
          # The anycloud seeded below must be the one this backmesh embeds.
          gh release download "$BACKMESH_VERSION" --repo "$GITHUB_REPOSITORY" --pattern compatibility.json
          embedded=$(jq -r .anycloud compatibility.json) && rm compatibility.json
          [[ $embedded == "$ANYCLOUD_VERSION" ]] \
            || { echo "::error::$BACKMESH_VERSION embeds anycloud $embedded, not ANYCLOUD_VERSION $ANYCLOUD_VERSION; bump them together"; exit 1; }
          asset=anycloud-linux-x64.tar.gz
          # Signed in, as above: anonymous release downloads can answer 504
          # for a while.
          gh release download "v$ANYCLOUD_VERSION" --repo anycloud-sh/releases --pattern "$asset"
          echo "$ANYCLOUD_SHA256  $asset" | sha256sum -c -
          tar -xzf "$asset" anycloud && rm "$asset"
          # backmesh runs its own copy of anycloud, which it would otherwise
          # download anonymously.
          install -D -m 755 anycloud ~/.backmesh/bin/"$ANYCLOUD_VERSION"/anycloud
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          # backmesh and the diagnose step's anycloud share this state, which
          # backmesh otherwise keeps in ~/.backmesh/anycloud.
          echo "ANYCLOUD_DIR=$HOME/.anycloud" >>"$GITHUB_ENV"
          echo "BACKMESH_ANYCLOUD_DIR=$HOME/.anycloud" >>"$GITHUB_ENV"

      # ANYCLOUD_API_URLS, a JSON object of org to control plane URL, points
      # anycloud at the org's; the sign-in for it is exchanged from
      # ANYCLOUD_GITHUB_TOKEN. Fail-closed: a missing or malformed variable,
      # or an org it leaves out, stops the run, so a lost URL can't turn into
      # a second control plane. Only `install` with `fresh` runs without one,
      # and only for an org it leaves out.
      - name: Sign in to the org's control plane
        env:
          URLS: ${{ vars.ANYCLOUD_API_URLS }}
          GITHUB_TOKEN: ${{ secrets.ANYCLOUD_GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
          FRESH: ${{ inputs.fresh }}
        run: |
          # GitHub org names ignore case.
          org=${ORG,,}
          [[ $org =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::Not a GitHub org name: $ORG"; exit 1; }
          # Distinct orgs whatever their case; a value is the org's URL, and
          # only an org left out has none.
          jq -e 'type == "object" and ([keys[] | ascii_downcase] | length == (unique | length))' <<<"$URLS" >/dev/null 2>&1 \
            || { echo "::error::ANYCLOUD_API_URLS isn't a JSON object of distinct orgs to URLs"; exit 1; }
          named=$(jq -r --arg org "$org" 'with_entries(.key |= ascii_downcase)
            | if has($org) then "url \(.[$org])" else "none" end' <<<"$URLS")
          if [[ $FRESH == true ]]; then
            [[ $MODE == install && $named == none ]] \
              || { echo "::error::fresh is for an install on an org ANYCLOUD_API_URLS leaves out"; exit 1; }
            echo "A fresh install: ANYCLOUD_API_URLS names no control plane for $org"
            exit 0
          fi
          [[ $named != none ]] \
            || { echo "::error::ANYCLOUD_API_URLS names no control plane for $org; for a first install, dispatch install with fresh"; exit 1; }
          url=${named#url }
          [[ $url =~ ^https://[a-z0-9-]+\.anycloud\.sh$ ]] \
            || { echo "::error::$org's control plane isn't a hosted API URL: $url"; exit 1; }
          echo "API_URL=$url" >>"$GITHUB_ENV"
          # Its output on a refusal is the device-code prompt, no secret.
          out=$(API_URL=$url anycloud login "$url" 2>&1) \
            || { echo "$out"; echo "::error::ANYCLOUD_GITHUB_TOKEN couldn't sign in to $url"; exit 1; }
          echo "Signed in to $org's control plane, $url"

      # Step 3's `--generate` runs as each cloud's CI identity, and uninstall
      # deletes what it generated as the same one, else prints the commands.
      # anycloud generates on AWS only from a named profile, so the role's
      # session is saved as the default one.
      - if: (inputs.mode == 'install' || inputs.mode == 'uninstall') && (contains(format(' {0} ', inputs.clouds), ' aws ') || startsWith(inputs.control-plane, 'aws:'))
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        id: aws
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          # The session can't refresh, and install's second --generate runs
          # after cluster create; two hours covers both.
          role-duration-seconds: 7200
          output-credentials: true
      - if: (inputs.mode == 'install' || inputs.mode == 'uninstall') && (contains(format(' {0} ', inputs.clouds), ' aws ') || startsWith(inputs.control-plane, 'aws:'))
        name: Save the role's session as the default profile
        env:
          KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          SECRET: ${{ steps.aws.outputs.aws-secret-access-key }}
          SESSION: ${{ steps.aws.outputs.aws-session-token }}
        run: |
          mkdir -p ~/.aws
          printf '[default]\naws_access_key_id = %s\naws_secret_access_key = %s\naws_session_token = %s\n' \
            "$KEY_ID" "$SECRET" "$SESSION" >~/.aws/credentials
          chmod 600 ~/.aws/credentials
      # gcloud's active account and project are the ones install generates with.
      - if: (inputs.mode == 'install' || inputs.mode == 'uninstall') && (contains(format(' {0} ', inputs.clouds), ' gcp ') || startsWith(inputs.control-plane, 'gcp:'))
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      - if: (inputs.mode == 'install' || inputs.mode == 'uninstall') && (contains(format(' {0} ', inputs.clouds), ' gcp ') || startsWith(inputs.control-plane, 'gcp:'))
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - if: (inputs.mode == 'install' || inputs.mode == 'uninstall') && (contains(format(' {0} ', inputs.clouds), ' azure ') || startsWith(inputs.control-plane, 'azure:'))
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Read-only: `--plan` asks nothing new of a human and changes nothing
      # billed, but it still reads the control plane (the existing listener's
      # routes), with anycloud's GitHub sign-in, and signs in to each
      # named cloud's CLI above, since the plan reads real quotas through it.
      # Use this before a live `install` dispatch whose plan you haven't seen
      # yet, such as one that connects a cloud for the first time: check it
      # shows only the change you expect (an added cloud's runners, say)
      # before dispatching without `plan`.
      - if: inputs.mode == 'install' && inputs.plan
        name: backmesh install --plan
        env:
          BACKMESH_UNSUPPORTED_CI_OVERRIDE: anycloud-ci
          # anycloud's GitHub sign-in: the cluster's owner and DNS name. Set
          # here too, as the apply step below sets it, so reading the
          # control plane can't fall back to a device-code prompt.
          GITHUB_TOKEN: ${{ secrets.ANYCLOUD_GITHUB_TOKEN }}
          ORG: ${{ inputs.org }}
        run: |
          read -ra clouds <<<"$CLOUDS"
          placement=(--control-plane "$CONTROL_PLANE")
          for cloud in "${clouds[@]}"; do placement+=(--runners "$cloud"); done
          out=$RUNNER_TEMP/install-plan.json
          backmesh install --org "$ORG" "${placement[@]}" --plan --json | tee "$out"
          {
            echo '### Install plan'
            echo '```json'
            cat "$out"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - if: inputs.mode == 'install' && !inputs.plan
        name: backmesh install
        env:
          BACKMESH_UNSUPPORTED_CI_OVERRIDE: anycloud-ci
          # anycloud's GitHub sign-in: the cluster's owner and DNS name.
          GITHUB_TOKEN: ${{ secrets.ANYCLOUD_GITHUB_TOKEN }}
          ORG: ${{ inputs.org }}
        # The sign-in and App prompts also go to annotations, which show on
        # the run's page with the live log while the step runs, and to the
        # job summary, which keeps them after it. Install waits an hour for
        # the App; here it stops after 15 minutes, while it's still waiting:
        # once the App comes it prints 'Creating the control plane on' (a
        # fresh or resumed one) or 'Using the control plane on' (a reused
        # one), and it's left to run.
        run: |
          read -ra clouds <<<"$CLOUDS"
          log=$RUNNER_TEMP/install.log
          : >"$log"
          # The control plane goes where `control-plane` says; each cloud's
          # runners take backmesh's fixed regions that the account allows.
          placement=(--control-plane "$CONTROL_PLANE")
          for cloud in "${clouds[@]}"; do placement+=(--runners "$cloud"); done
          # Install agrees to a plan by its ID, as upgrade does: joining a
          # control plane another org already uses needs the agreement (the
          # same-owner check), and --plan is read-only.
          plan=$(backmesh install --org "$ORG" "${placement[@]}" --plan --json) || { echo "$plan"; exit 1; }
          id=$(tail -n1 <<<"$plan" | jq -er .planId) || { echo "$plan"; exit 1; }
          echo "::notice title=Install plan::$id"
          { echo "**Install plan agreed:** \`$id\`"; echo '```json'; tail -n1 <<<"$plan" | jq .; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          backmesh install --org "$ORG" "${placement[@]}" --yes --plan-id "$id" >"$log" 2>&1 &
          pid=$!
          tail -f --pid="$pid" "$log" &
          signin= app=
          while kill -0 "$pid" 2>/dev/null; do
            sleep 5
            if [[ -z $signin ]] && line=$(grep -m1 'login/device' "$log"); then
              signin=1
              echo "::notice title=GitHub sign-in for $ORG::$line"
              echo "**GitHub sign-in:** $line" >>"$GITHUB_STEP_SUMMARY"
            fi
            if [[ -z $app ]] && line=$(grep -m1 'installs the backmesh GitHub App' "$log"); then
              app=$SECONDS
              echo "::warning title=Install the backmesh App on $ORG::$line"
              echo "**Install the backmesh App on $ORG:** $line" >>"$GITHUB_STEP_SUMMARY"
            fi
            if [[ -n $app ]] && ((SECONDS - app > 900)) && ! grep -Eq '(Creating|Using) the control plane on' "$log"; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" || true
              wait
              echo "::error::The backmesh App isn't installed on $ORG after 15 minutes, so install stopped before connecting a cloud. An owner of $ORG installs it from the link above, then dispatches install again."
              exit 1
            fi
          done
          wait "$pid" && code=0 || code=$?
          # tail's last lines, then install's status.
          wait
          exit "$code"

      # A fresh install's control plane, for the owner to add to
      # ANYCLOUD_API_URLS, which later runs read; also after a failed install
      # that got as far as creating it, so its re-run reuses it.
      - if: ${{ !cancelled() && inputs.mode == 'install' && inputs.fresh && !inputs.plan }}
        name: The new control plane's URL
        run: |
          [[ -f ~/.anycloud/api-url ]] || { echo "No control plane was created"; exit 0; }
          url=$(anycloud api status --json | jq -r .url)
          echo "::notice title=Add to ANYCLOUD_API_URLS::\"${ORG,,}\": \"$url\""
          echo "**Add to ANYCLOUD_API_URLS:** \`\"${ORG,,}\": \"$url\"\`" >>"$GITHUB_STEP_SUMMARY"

      # The hosted API to the release's anycloud first, then the
      # listener to its images and classes. It signs in to the hosted API with
      # anycloud's GitHub sign-in, and `--runners` names each cloud whose runners
      # stay, in backmesh's fixed regions, so it reads nothing through a cloud CLI
      # and needs no cloud sign-in. A cloud `clouds` leaves out drains and is
      # removed, shown in the plan's `changes.removed`, and only with
      # `remove-clouds`, so a routine dispatch can't drain a cloud. Without a
      # terminal a change to the runners needs a plan: the first run moves an
      # older control plane, then exits needs_plan, `--plan` reads the plan on
      # the moved control plane, and `--yes --plan-id` applies it.
      - if: inputs.mode == 'upgrade'
        name: backmesh upgrade
        env:
          GITHUB_TOKEN: ${{ secrets.ANYCLOUD_GITHUB_TOKEN }}
          REMOVE_CLOUDS: ${{ inputs.remove-clouds }}
        run: |
          read -ra clouds <<<"$CLOUDS"
          runners=()
          for cloud in "${clouds[@]}"; do runners+=(--runners "$cloud"); done
          out=$RUNNER_TEMP/upgrade.json
          if backmesh upgrade "${runners[@]}" --json >"$out"; then
            cat "$out"
            exit 0
          fi
          cat "$out"
          [[ $(tail -n1 "$out" | jq -r '.error.code // empty') == needs_plan ]] || exit 1
          backmesh upgrade "${runners[@]}" --plan --json >"$out" || { cat "$out"; exit 1; }
          cat "$out"
          id=$(tail -n1 "$out" | jq -er .planId)
          removed=$(tail -n1 "$out" | jq -r '[.orgs[] | (.changes.removed // [])[]] | unique | join(" ")')
          if [[ -n $removed && $REMOVE_CLOUDS != true ]]; then
            echo "::error title=Upgrade removes clouds::The plan removes $removed; re-run with remove-clouds to drain it, or add it to clouds to keep it"
            exit 1
          fi
          echo "::notice title=Upgrade plan::$id"
          backmesh upgrade "${runners[@]}" --yes --plan-id "$id"
      - if: ${{ !cancelled() && inputs.mode == 'upgrade' }}
        name: backmesh status
        env:
          GITHUB_TOKEN: ${{ secrets.ANYCLOUD_GITHUB_TOKEN }}
        run: backmesh status

      # The pinned anycloud's CLI refuses an older API, so an installation
      # left on an older release first moves to it. Since 0.1.74 `api
      # upgrade` needs no Docker or local API and takes no --yes.
      - if: inputs.mode == 'uninstall'
        name: Move the control plane to the pinned anycloud
        env:
          GITHUB_TOKEN: ${{ secrets.ANYCLOUD_GITHUB_TOKEN }}
        run: |
          url=$(anycloud api status --json | jq -r .url)
          anycloud api upgrade
          # An API older than the CLI takes the upgrade without an upgrade
          # record, so `api status --watch` has nothing to follow.
          for _ in $(seq 120); do
            version=$(curl -fsS --max-time 10 "$url/v1/version" | jq -r .version) || version=
            [[ $version == "$ANYCLOUD_VERSION" ]] && exit 0
            sleep 10
          done
          echo "::error::$url still serves ${version:-nothing}, not $ANYCLOUD_VERSION"
          exit 1

      # Uninstall's one path. An admin of the org opens the sign-in from this
      # log; --yes skips the confirmations, and --confirm names the cluster for
      # the bucket's deletion, which happens only when asked. --org for the
      # control plane's only org removes the whole control plane.
      - if: inputs.mode == 'uninstall'
        name: backmesh uninstall
        env:
          GITHUB_TOKEN: ${{ secrets.ANYCLOUD_GITHUB_TOKEN }}
          ORG: ${{ inputs.org }}
          DELETE_BUCKET: ${{ inputs.delete-checkpoint-bucket }}
        run: |
          flags=(--org "$ORG" --yes --confirm backmesh)
          if [[ $DELETE_BUCKET == true ]]; then flags+=(--delete-checkpoint-bucket); fi
          backmesh uninstall "${flags[@]}"
          echo "::notice title=Remove from ANYCLOUD_API_URLS::${ORG,,} is uninstalled"

      # Read-only, from the hosted API: the status, the org's listener log,
      # then the newest runner Jobs that ended on their own and any named in
      # `ids`, each with its end and the log tail anycloud kept; a named Job's
      # events also carry their metadata, less its log tail. Only named fields
      # are printed, never a Job's env (the JIT config) or command, and long
      # tokens are redacted.
      - if: inputs.mode == 'diagnose'
        name: Diagnose the runner Jobs
        env:
          GITHUB_TOKEN: ${{ secrets.ANYCLOUD_GITHUB_TOKEN }}
          ORG: ${{ inputs.org }}
          JOBS: ${{ inputs.jobs }}
          IDS: ${{ inputs.ids }}
        run: |
          redact() { sed -E 's/[A-Za-z0-9+/=_.-]{100,}/[redacted]/g'; }
          # Through a pipe of its own: backmesh can leave the step's stdout
          # non-blocking, and a later burst then fails with EAGAIN ("sed:
          # couldn't write ... Resource temporarily unavailable", diagnose
          # runs 42513124550 and 42515273003).
          backmesh status | cat || true
          echo "::group::$ORG's listener log"
          # The listener logs only failures and job events, so a healthy one
          # that GitHub sent no job has an empty log.
          log=$(timeout 60 backmesh logs --org "$ORG" 2>&1) && code=0 || code=$?
          [[ -n $log ]] || log="(empty log, exit $code)"
          tail -n 300 <<<"$log" | redact
          echo "::endgroup::"
          session=$(backmesh status --org "$ORG" --json | jq -er '.orgs[0].session // empty')
          # One listing, capped at 1,000 (anycloud's MAX_LIST_LIMIT). Live Jobs
          # come first, up to the same cap, and ended Jobs never push them out;
          # the newest ended Jobs fill what's left (anycloud v0.1.73
          # workload-queries.ts:983-1023). At the cap, diagnose says which
          # part was cut.
          limit=1000
          anycloud job list --session "$session" -n "$limit" --json >"$RUNNER_TEMP/jobs.json"
          echo "Runner Jobs in $session by state:"
          jq -r 'group_by(.state)[] | "  \(.[0].state): \(length)"' "$RUNNER_TEMP/jobs.json"
          if (($(jq length "$RUNNER_TEMP/jobs.json") >= limit)); then
            ended=$(jq '[.[] | select(.state | IN("completed", "errored", "failed", "invalid", "terminated"))] | length' "$RUNNER_TEMP/jobs.json")
            if ((ended > 0)); then
              cut="live counts are complete; the ended counts and the list below cover only the newest ended Jobs"
            else
              cut="every listed Job is live, so even the live counts and the list below cover only the newest $limit"
            fi
            echo "  TRUNCATED: the listing reached its $limit-Job cap: $cut."
            echo "::warning::diagnose's runner Job listing reached its $limit-Job cap: $cut"
          fi
          # Why an event happened, from the metadata anycloud records on it
          # (anycloud v0.1.73 src/api/services/task.ts:282-299 and the launch
          # classifier's fields): the diagnosis, the error's message, the
          # target, and a region denied to the credential.
          why='def denied: (.metadata // {}).targetRegionDenied as $d
            | if $d == null then null else "region denied\(if $d != "" then " (\($d))" else "" end)" end;
          def why: (.metadata // {}) as $m | ($m.error // null) as $e
            | [($m.diagnosis // $m.errorKind),
               (if ($e | type) == "object" then $e.code else null end),
               $m.reason,
               ($m.message // (if ($e | type) == "object" then $e.message else $e end)
                 | if type == "string" then .[:200] else null end),
               ([$m.targetVmType, $m.targetRegion, $m.targetAvailabilityZone]
                 | map(select(. != null and . != "")) | if length > 0 then "target \(join(" "))" else null end),
               denied]
            | map(select(. != null and . != "")) | join("; ") | if . == "" then "no reason recorded" else . end;
          # The same, short enough to count: the diagnosis, the error code and
          # a denial with its region; else the reason with its numbers masked.
          def cause: . as $event | (.metadata // {}) as $m
            | [($m.diagnosis // $m.errorKind), ($m.error | if type == "object" then .code else null end),
               (denied | if . then "\(.) in \($m.targetRegion // "?")" else null end)]
            | map(select(. != null and . != "")) | join(" ")
            | if . != "" then . else ($event | why | gsub("[0-9]+"; "N")) end;'
          # Each retrying or recovering runner Job's newest retrying or
          # recovering event, counted by scale set, that event's state and its
          # cause; a Job that has moved on since the listing still counts there.
          # The scale set is the runner name's code (bm<install>-<code>-...).
          jq -r '.[] | select(.state | IN("retrying", "recovering")) | .id' "$RUNNER_TEMP/jobs.json" >"$RUNNER_TEMP/stuck"
          while read -r id <&3; do
            code=$(cut -d- -f2 <<<"$id")
            timeout 30 anycloud status "$id" --json >"$RUNNER_TEMP/stuck-status.json" 2>/dev/null \
              && jq -ce --arg code "$code" "$why"'
                [.events[] | select(.state | IN("retrying", "recovering"))] | last
                | if . then { $code, state, reason: cause }
                  else { $code, state: "listed", reason: "no retrying or recovering event" } end' \
                "$RUNNER_TEMP/stuck-status.json" \
              || jq -nc --arg code "$code" '{ $code, state: "unknown", reason: "status unavailable" }'
          done 3<"$RUNNER_TEMP/stuck" >"$RUNNER_TEMP/stuck.json"
          echo "Retrying and recovering runner Jobs by scale set (code), with their newest causes:"
          jq -rs 'if length == 0 then "  none" else group_by(.code, .state)[]
            | "  \(.[0].code): \(length) runner Job\(if length == 1 then "" else "s" end) \(.[0].state): \(group_by(.reason) | sort_by(-length) | map("\(.[0].reason) ×\(length)") | join(", "))" end' \
            "$RUNNER_TEMP/stuck.json" | redact
          echo "Each, oldest first: ID, state, end, VM type, started, completed, cleaned, cleanup error:"
          jq -r 'def at: if . then . / 1000 | floor | todate else "-" end; sort_by(.startedAt)[]
            | "  \(.id) \(.state) \(.endReason // "-") \([.vmType // "-"] | flatten | join(",")) \(.startedAt | at) \(.completedAt | at) \(.cleanedAt | at) \(.cleanupError // "")"' \
            "$RUNNER_TEMP/jobs.json" | redact
          jq -r --argjson n "$JOBS" '[.[] | select(.state | IN("completed", "errored", "failed", "invalid"))]
            | sort_by(.startedAt) | reverse | .[:$n][] | .id' "$RUNNER_TEMP/jobs.json" >"$RUNNER_TEMP/ended"
          # Named Jobs too, such as a terminated one, each event with its
          # metadata less any container log tail.
          read -ra named <<<"$IDS"
          : >"$RUNNER_TEMP/named"
          for id in "${named[@]}"; do
            [[ $id =~ ^bm[0-9a-z]{5}-[0-9a-z]{2}-[0-9a-z]{8}$ ]] || { echo "::warning::$id isn't a runner Job ID"; continue; }
            echo "$id" >>"$RUNNER_TEMP/named"
            grep -qx "$id" "$RUNNER_TEMP/ended" || echo "$id" >>"$RUNNER_TEMP/ended"
          done
          # fd 3: exec and logs may read stdin.
          while read -r id <&3; do
            echo "::group::$id"
            # A named Job gets every event, not the newest 200.
            full=false history=()
            if grep -qx "$id" "$RUNNER_TEMP/named"; then full=true history=(--history); fi
            anycloud status "$id" --json "${history[@]}" >"$RUNNER_TEMP/status.json" || { echo "::endgroup::"; continue; }
            jq --argjson full "$full" "$why"'def at: if . then . / 1000 | floor | todate else null end; {
              id: .workload.id, state: .workload.state, endReason: .workload.endReason,
              lastAttemptEndReason: .workload.lastAttemptEndReason, deployment: .workload.deploymentId,
              vmType: .workload.vmType, region: .workload.region,
              startedAt: (.workload.startedAt | at), completedAt: (.workload.completedAt | at),
              cleanedAt: (.workload.cleanedAt | at), cleanupError: .workload.cleanupError,
              buckets: [.workload.inputBucket, .workload.outputBucket, .workload.checkpointBucket],
              events: [.events[] | {state, at: (.createdAt | at)}
                + if .state | IN("retrying", "recovering") then {reason: why} else {message: (.metadata.message // .metadata.reason)} end
                + if $full then {metadata: (.metadata | if type == "object" then del(.logs) else . end)} else {} end]
            }' "$RUNNER_TEMP/status.json" | redact || true
            echo "--- anycloud logs $id"
            timeout 120 anycloud logs "$id" 2>&1 | tail -n 200 | redact || true
            echo "::endgroup::"
          done 3<"$RUNNER_TEMP/ended"

      # The lost-runner live check: terminates one runner Job, so the runner's
      # report of its job can be timed. It goes through the control plane with
      # anycloud's sign-in and no cloud credentials. The fail-fast relies
      # on the cloud shutting the VM's OS down on delete, as EC2's
      # TerminateInstances does. The Job ends cancelled, which backmesh doesn't
      # rerun. Fail-closed: the runner must be running an in-progress
      # lost-runner-check job on a backmesh label, and be a running runner Job
      # in a backmesh session.
      - if: inputs.mode == 'stop-runner'
        name: Terminate a lost-runner check's runner Job
        env:
          GITHUB_TOKEN: ${{ secrets.ANYCLOUD_GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RUNNER_ID: ${{ inputs.runner }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          [[ $RUNNER_ID =~ ^bm[0-9a-z]{5}-[0-9a-z]{2}-[0-9a-z]{8}$ ]] || fail "$RUNNER_ID isn't a runner Job ID"
          # The GitHub job it runs: an in-progress lost-runner-check job on a
          # backmesh label in this repository. The runs query no longer
          # filters by the run's own status: that field can lag the job's own
          # runner assignment, which e2e.yml's stop member has already seen
          # (e2e run 42888142963). The job-level in-progress check below
          # doesn't share that lag, so it stays the fail-closed condition; the
          # created window and per_page just bound how much history the query
          # reads. Looked up for up to about 30 s as a backstop for any
          # remaining lag.
          job=
          since=$(date -u -d '-2 hours' +%FT%TZ)
          for attempt in 1 2 3 4 5 6; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/lost-runner-check.yml/runs?branch=main&created=%3E%3D$since&per_page=20" \
              --jq '.workflow_runs[] | select(.event == "workflow_dispatch" and .head_branch == "main") | .id')
            for run in $runs; do
              job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" \
                --jq ".jobs[] | select(.runner_name == \"$RUNNER_ID\" and .status == \"in_progress\" and any(.labels[]; startswith(\"backmesh-\")))" )
              [[ -n $job ]] && break 2
            done
            (( attempt < 6 )) && sleep 5
          done
          [[ -n $job ]] || fail "$RUNNER_ID runs no in-progress lost-runner-check job on a backmesh label"
          jq -c '{run_id, id, name, labels, runner_name, started_at}' <<<"$job"
          anycloud status "$RUNNER_ID" --json >"$RUNNER_TEMP/runner.json" || fail "anycloud status failed for $RUNNER_ID"
          jq -c '{id: .workload.id, state: .workload.state, cloud: .workload.cloudProvider, session: .workload.session, vms: [.vms[]? | {region, endedAt}]}' "$RUNNER_TEMP/runner.json"
          [[ $(jq -r .workload.state "$RUNNER_TEMP/runner.json") == running ]] || fail "$RUNNER_ID isn't running"
          [[ $(jq -r '.workload.session // ""' "$RUNNER_TEMP/runner.json") == bm-* ]] || fail "$RUNNER_ID isn't in a backmesh session"
          # The request's time: cleanup then reads the VM's diagnostics for up
          # to 15 s before deleting it, so the check's last "alive" line marks
          # the VM's end.
          at=$(date -u +%FT%T.%3NZ)
          echo "Terminating $RUNNER_ID at $at"
          anycloud terminate "$RUNNER_ID"
          echo "terminate_requested_at=$at" >>"$GITHUB_STEP_SUMMARY"
          # terminate succeeds for a Job that already ended, so check it
          # ended by this request.
          anycloud status "$RUNNER_ID" --json >"$RUNNER_TEMP/runner.json" || fail "anycloud status failed for $RUNNER_ID"
          jq -c '{state: .workload.state, endReason: .workload.endReason}' "$RUNNER_TEMP/runner.json"
          [[ $(jq -r .workload.state "$RUNNER_TEMP/runner.json") == terminated ]] || fail "$RUNNER_ID isn't terminated"
