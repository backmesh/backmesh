name: Cue benchmark

# The cue benchmark (benchmarks/cue/README.md): from a GitHub-hosted runner,
# pushes to the `target` repo's bench branch, in turn with `backmesh cue`
# sent `lead` seconds ahead, without, and to its bench-hosted branch on
# ubuntu-latest, and reports per arm the share of each push's `width`
# first-wave jobs a runner took within 10 s of their queueing, their queued
# to first real step and queued to done, in the job summary. The target's
# jobs run on `label` in our CI installation.
# Dispatch only. The e2e environment holds E2E_SIGN_IN_TOKEN, the owner's
# backmesh sign-in, which cues as them, and CUE_BENCH_DEPLOY_KEY, the
# target repo's write deploy key: a deploy key's push starts workflows,
# where this workflow's own token's wouldn't.
on:
  workflow_dispatch:
    inputs:
      target:
        description: the target repo, owner/name, whose write deploy key is CUE_BENCH_DEPLOY_KEY
        required: true
      rounds:
        description: cued, uncued and GitHub-hosted pushes each, 1 to 10
        default: '5'
      lead:
        description: seconds from the cue to the push, 30 to 600
        default: '75'
      width:
        description: the first wave's jobs a push, a matrix on `label`, 1 to 32
        default: '8'
      label:
        description: >-
          the backmesh label the target's job runs on; must be one no other
          workflow in anycloud or backmesh uses, or its jobs skew the figures
        default: backmesh-16

permissions: {}

concurrency:
  group: cue-benchmark
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    environment: e2e
    # Covers the worst case (rounds=10, lead=600 s): about 210 minutes,
    # mostly the leads and the 200 s GAP_MS after each of up to 20 pushes
    # on the label.
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Check the inputs
        env:
          ROUNDS: ${{ inputs.rounds }}
          LEAD_S: ${{ inputs.lead }}
          WIDTH: ${{ inputs.width }}
          LABEL: ${{ inputs.label }}
          TARGET_REPO: ${{ inputs.target }}
        run: |
          [[ $TARGET_REPO =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
          [[ $ROUNDS =~ ^[0-9]+$ ]] && ((ROUNDS >= 1 && ROUNDS <= 10)) || exit 1
          [[ $LEAD_S =~ ^[0-9]+$ ]] && ((LEAD_S >= 30 && LEAD_S <= 600)) || exit 1
          [[ $WIDTH =~ ^[0-9]+$ ]] && ((WIDTH >= 1 && WIDTH <= 32)) || exit 1
          [[ $LABEL =~ ^backmesh-[a-z0-9-]+$ ]]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: ''

      # The CLI from this commit: the cue runs its real path.
      - run: yarn install --frozen-lockfile
      - run: yarn build

      - name: Load the target's deploy key
        env:
          DEPLOY_KEY: ${{ secrets.CUE_BENCH_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/cue-bench
          printf '%s\n' "$DEPLOY_KEY" >~/.ssh/cue-bench
          # GitHub's host keys, over HTTPS with the job's token: anonymous
          # reads from a hosted runner's shared IP soon get 403.
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >>~/.ssh/known_hosts

      - name: Run the benchmark
        env:
          TARGET_REPO: ${{ inputs.target }}
          ROUNDS: ${{ inputs.rounds }}
          LEAD_S: ${{ inputs.lead }}
          WIDTH: ${{ inputs.width }}
          LABEL: ${{ inputs.label }}
          BACKMESH_CLI: dist/cli/index.js
          BACKMESH_CUE_TOKEN: ${{ secrets.E2E_SIGN_IN_TOKEN }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/cue-bench -o IdentitiesOnly=yes
          OUTPUT_DIR: ${{ runner.temp }}/cue-benchmark
        run: node benchmarks/cue/run.ts

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cue-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cue-benchmark/
          if-no-files-found: warn
          retention-days: 90
