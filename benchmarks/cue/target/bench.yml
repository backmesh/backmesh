# The cue benchmark's target (benchmarks/cue/README.md): run.ts copies this to
# the target repo as .github/workflows/bench-<label>-w<width>.yml, once for
# the backmesh label on the bench branch and once for ubuntu-latest on
# bench-hosted, with the label for runs-on, the branch and the width's
# shards. The bench jobs are the run's first wave; report needs them all.
name: Bench

on:
  push:
    branches: [__BRANCH__]

permissions: {}

jobs:
  bench:
    runs-on: __LABEL__
    timeout-minutes: 20
    strategy:
      # One failed job leaves the rest to run, and be measured.
      fail-fast: false
      matrix:
        shard: __SHARDS__
    # The checkout of a private target, such as the control-plane burst's.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: ''

      - name: Install
        run: corepack enable && yarn install --frozen-lockfile --ignore-scripts

      # The first real step: the benchmark times the push to its start.
      - name: Marker
        run: echo marker

  # On a hosted runner, so the label serves only the first wave.
  report:
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # report.mjs writes its row to the results branch
      actions: read # and reads the bench jobs' step times
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: node report.mjs
