# A job on each cloud's label that isn't public. A fork's run of it is
# cancelled; a same-repo pull request's runs.
name: private-labels
on: pull_request
permissions: {}
jobs:
  label:
    strategy:
      fail-fast: false
      matrix:
        label:
          [
            backmesh-ubuntu-2404-kvm-4vcpu,
            backmesh-gcp-ubuntu-2404-2vcpu,
            backmesh-azure-ubuntu-2404-2vcpu,
          ]
    runs-on: ${{ matrix.label }}
    steps:
      - run: echo "ran on ${{ matrix.label }}"
